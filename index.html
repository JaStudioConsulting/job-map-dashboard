    // Helper: Smart Title / Keyword Matching for Candidates & Jobs
    function isSimilarTitle(jobTitle = '', candTitle = '', candNotes = '', candIndustry = '') {
      const clean = (str) => (str || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ');
      const jClean = clean(jobTitle);
      const cClean = `${clean(candTitle)} ${clean(candNotes)} ${clean(candIndustry)}`;

      const stems = [
        'weld', 'mold', 'mould', 'machin', 'electric', 'electri', 'mechan', 'technician', 'millwright',
        'tool', 'die', 'assembl', 'fitter', 'fabricat', 'supervisor', 'manager', 'director',
        'lead', 'operator', 'engineer', 'quality', 'safety', 'cnc', 'hydraul', 'pneumat',
        'maintenance', 'service', 'dispatch', 'coordinator', 'purchas', 'buyer', 'procure',
        'inventory', 'supply chain', 'account', 'sales', 'business develop', 'marketing',
        'driver', 'truck', 'fleet', 'transit', 'production', 'plant', 'chemist', 'labor'
      ];

      for (const stem of stems) {
        if (jClean.includes(stem) && cClean.includes(stem)) {
          return true;
        }
      }

      const jWords = jClean.split(/\s+/).filter(w => w.length >= 4);
      return jWords.some(w => cClean.includes(w));
    }

    // --- HAVERSINE DISTANCE FORMULA ---
    function calculateDistance(lat1, lon1, lat2, lon2, unit = 'km') {
      const R = unit === 'mi' ? 3958.8 : 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) *
        Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c * 10) / 10;
    }

    // --- ROBUST CSV PARSER ---
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(cell);
          cell = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(cell);
          if (row.length > 0 && row.some(c => c.trim() !== '')) {
            lines.push(row);
          }
          row = [];
          cell = '';
        } else {
          cell += char;
        }
      }
      if (cell !== '' || row.length > 0) {
        row.push(cell);
        lines.push(row);
      }

      if (lines.length < 2) return [];
      const headers = lines[0].map(h => h.trim().replace(/^"|"$/g, ''));
      return lines.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = (r[idx] || '').trim();
        });
        return obj;
      });
    }

    // Splits multi-location strings by common delimiters (/, ;, |, newlines, &, and)
    function splitLocationString(rawLoc) {
      if (!rawLoc || typeof rawLoc !== 'string') return [];
      const text = rawLoc.trim();
      if (!text) return [];

      let parts = [];
      if (/[\/;|\n\r]+/.test(text)) {
        parts = text.split(/[\/;|\n\r]+/).map(s => s.trim()).filter(Boolean);
      } else if (/\s+and\s+|\s+&\s+/i.test(text) && (text.includes(',') || text.includes('ON') || text.includes('CA') || text.includes('MI'))) {
        parts = text.split(/\s+and\s+|\s+&\s+/i).map(s => s.trim()).filter(Boolean);
      } else {
        const provinceMatches = text.match(/(?:[A-Za-z0-9\s.-]+,\s*(?:ON|Ontario|BC|AB|QC|MB|SK|NS|NB|NL|PE|CA|California|MI|Michigan|OH|NY|TX|FL|[A-Z]{2}))/gi);
        if (provinceMatches && provinceMatches.length > 1) {
          parts = provinceMatches.map(s => s.trim()).filter(Boolean);
        } else {
          parts = [text];
        }
      }
      return parts.length > 0 ? parts : [text];
    }

    // Normalizes location text and resolves coordinates (with localStorage cache & exact address fuzzy lookup)
    function resolveCoordinates(locationStr, jobDescription = '') {
      if (!locationStr || locationStr.trim() === '') {
        const match = jobDescription.match(/Location:\s*([^\r\n,]+(?:,\s*[^\r\n]+)?)/i);
        if (match && match[1]) {
          locationStr = match[1].trim();
        }
      }

      if (!locationStr) return null;

      // 1. Check persistent localStorage geocache
      try {
        const cache = JSON.parse(localStorage.getItem('tttg_geo_cache') || '{}');
        if (cache[locationStr]) {
          return { latLng: cache[locationStr], resolvedName: locationStr, isExact: true };
        }
      } catch (e) {}

      const cleaned = locationStr.toLowerCase().replace(/[^\w\s,]/g, '').trim();
      
      // 2. Exact match in built-in city coordinates
      if (CITY_COORDINATES[cleaned]) {
        return { latLng: CITY_COORDINATES[cleaned], resolvedName: locationStr, isExact: false };
      }

      // 3. Substring match for city in exact address (e.g. "4500 Rhodes Dr, Windsor, ON")
      for (const [key, coords] of Object.entries(CITY_COORDINATES)) {
        if (cleaned.includes(key) || key.includes(cleaned)) {
          return { latLng: coords, resolvedName: locationStr, isExact: false };
        }
      }

      return null;
    }

    // --- JSONP GOOGLE SHEETS FETCHER ---
    function fetchSheetViaJSONP(sheetId, sheetName) {
      return new Promise((resolve, reject) => {
        const callbackName = 'sheetCallback_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        
        window[callbackName] = function(data) {
          try {
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
            if (!data || !data.table) {
              reject(new Error('Invalid table format from Google Sheets'));
              return;
            }
            const headers = data.table.cols.map(c => (c.label || c.id || '').trim());
            const rows = data.table.rows.map(r => {
              const obj = {};
              headers.forEach((h, idx) => {
                const cell = r.c && r.c[idx];
                obj[h] = cell && cell.v !== null && cell.v !== undefined ? String(cell.v) : (cell && cell.f ? String(cell.f) : '');
              });
              return obj;
            });
            resolve(rows);
          } catch (e) {
            reject(e);
          }
        };

        script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${callbackName}`;
        script.onerror = () => {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error('JSONP network error'));
        };
        document.body.appendChild(script);
      });
    }

      const CSV_URL = 'https://docs.google.com/spreadsheets/d/1RexJFAEWRwNjzeGThutrA0zMObu2g4r3q0Vu0uiDbQs/gviz/tq?tqx=out:csv&sheet=Jobs';
      const CANDIDATES_CSV_URL = 'https://docs.google.com/spreadsheets/d/1RexJFAEWRwNjzeGThutrA0zMObu2g4r3q0Vu0uiDbQs/gviz/tq?tqx=out:csv&sheet=Candidates';

      // Background exact geocode worker for street-level precision and new locations
      const geocodeExactAddresses = async (jobList) => {
        let cache = {};
        try {
          cache = JSON.parse(localStorage.getItem('tttg_geo_cache') || '{}');
        } catch (e) {
          cache = {};
        }

        let updated = false;
        const currentList = [...jobList];

        for (let i = 0; i < currentList.length; i++) {
          const item = currentList[i];
          const locStr = (item.displayLocation || '').trim();
          if (!locStr || locStr === 'Location on request') continue;

          // If already in exact geocache
          if (cache[locStr]) {
            const cachedCoords = cache[locStr];
            if (!item.coords || item.coords[0] !== cachedCoords[0] || item.coords[1] !== cachedCoords[1]) {
              currentList[i] = { ...item, coords: cachedCoords };
              updated = true;
            }
            continue;
          }

          // Check if it's an exact address (has numbers) or coords are missing
          const needsGeocoding = /\d+/.test(locStr) || !item.coords;
          if (needsGeocoding) {
            try {
              // Rate-limit to protect OpenStreetMap Nominatim
              await new Promise(r => setTimeout(r, 650));
              const nominatimUrl = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ca,us&q=${encodeURIComponent(locStr)}`;
              const res = await fetch(nominatimUrl, { headers: { 'Accept-Language': 'en' } });
              const data = await res.json();
              if (data && data.length > 0) {
                const newCoords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                cache[locStr] = newCoords;
                localStorage.setItem('tttg_geo_cache', JSON.stringify(cache));
                currentList[i] = { ...item, coords: newCoords };
                updated = true;
                setJobs([...currentList]);
              }
            } catch (err) {
              console.warn('Geocoding address failed for:', locStr, err);
            }
          }
        }

        if (updated) {
          setJobs([...currentList]);
        }
      };

      // Expands multi-location rows and resolves initial coordinates
      const expandAndEnrichJobs = (rawRows) => {
        const enriched = [];

        rawRows.forEach((job, jobIdx) => {
          let rawLoc = (job['Location'] || '').trim();
          if (!rawLoc) {
            const match = (job['Job Description'] || '').match(/Location:\s*([^\r\n,]+(?:,\s*[^\r\n]+)?)/i);
            if (match && match[1]) rawLoc = match[1].trim();
          }
          if (!rawLoc) rawLoc = 'Location on request';

          const locations = splitLocationString(rawLoc);

          if (locations.length <= 1) {
            const singleLoc = locations[0] || rawLoc;
            const coordData = resolveCoordinates(singleLoc, job['Job Description']);
            enriched.push({
              ...job,
              id: job['Job ID'] || `job_${jobIdx}`,
              originalJobId: job['Job ID'],
              coords: coordData ? coordData.latLng : null,
              displayLocation: singleLoc,
              rawLocation: rawLoc,
              isMultiLocation: false,
              allLocations: [singleLoc]
            });
          } else {
            // Multi-site openings: Create separate branch entry for map & ranking
            locations.forEach((branchLoc, branchIdx) => {
              const coordData = resolveCoordinates(branchLoc, job['Job Description']);
              enriched.push({
                ...job,
                id: `${job['Job ID'] || `job_${jobIdx}`}_b${branchIdx + 1}`,
                originalJobId: job['Job ID'],
                coords: coordData ? coordData.latLng : null,
                displayLocation: branchLoc,
                rawLocation: rawLoc,
                isMultiLocation: true,
                locationIndex: branchIdx + 1,
                totalLocations: locations.length,
                allLocations: locations
              });
            });
          }
        });

        return enriched;
      };

      // Enrich and normalize candidates
      const enrichCandidates = (rawRows) => {
        return rawRows.map((cand, idx) => {
          const name = (cand['Candidate Name'] || cand['Candidates Candidate Name'] || cand['Name'] || '').trim();
          const title = (cand['Current Title'] || cand['Title'] || '').trim();
          const loc = (cand['Location'] || '').trim();
          const company = (cand['Current Company'] || '').trim();
          const industry = (cand['Industry'] || '').trim();
          const compTarget = (cand['Compensation Target'] || '').trim();

          const notes = (cand['Notes'] || '').trim();
          const shift = (cand['Shift'] || '').trim();
          const submittedTo = (cand['Submitted To'] || '').trim();
          const submittedOn = (cand['Submitted On'] || '').trim();
          const link = (cand['Submission Link'] || cand['Link'] || '').trim();
          const licenses = (cand['Licenses'] || cand['Certifications'] || '').trim();

          const coordData = resolveCoordinates(loc);

          return {
            id: `cand_${idx}`,
            name,
            title,
            location: loc,
            company,
            industry,
            compensationTarget: compTarget,
            currentCompensation: compCurrent,
            notes,
            shift,
            submittedTo,
            submittedOn,
            submissionLink: link,
            licenses,
            coords: coordData ? coordData.latLng : null

        }).filter(c => c.name);
      };

      // 1. Fetch Data (Jobs & Candidates Concurrently)
      const fetchJobs = async () => {

          let activeJobs = [];
          let loadedCandidates = [];
          
          // A. Fetch Jobs
          try {
            const rawRows = await fetchSheetViaJSONP('1RexJFAEWRwNjzeGThutrA0zMObu2g4r3q0Vu0uiDbQs', 'Jobs');
            activeJobs = rawRows.filter(j => (j['Status'] || '').toLowerCase() === 'active');
          } catch (jsonpErr) {
            console.warn('JSONP jobs fetch failed, trying standard CSV fetch:', jsonpErr);

            if (!res.ok) throw new Error(`HTTP error ${res.status}`);
            const csvText = await res.text();
            const parsed = parseCSV(csvText);

          }

          // B. Fetch Candidates
          try {
            const rawCand = await fetchSheetViaJSONP('1RexJFAEWRwNjzeGThutrA0zMObu2g4r3q0Vu0uiDbQs', 'Candidates');

          } catch (candJsonpErr) {
            console.warn('JSONP candidates fetch failed, trying standard CSV fetch:', candJsonpErr);
            try {
              const cRes = await fetch(CANDIDATES_CSV_URL);

                loadedCandidates = enrichCandidates(cParsed);
              }

              console.warn('Candidates CSV fetch fallback:', cFetchErr);

          }
          
          if (activeJobs.length === 0) {
            throw new Error('No active jobs found.');
          }

          const enriched = expandAndEnrichJobs(activeJobs);
          setJobs(enriched);

          if (loadedCandidates.length > 0) {

          setLastUpdated(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));

      // 2. Initialize Leaflet Map with Refined Executive Styling

          L.control.zoom({ position: 'bottomright' }).addTo(map);

          // Standard high-reliability OpenStreetMap Tiles (100% full coverage, zero gaps)
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {

          mapInstanceRef.current = map;

          // Force Leaflet to recalculate container dimensions & fetch all missing tiles
          setTimeout(() => {
            map.invalidateSize();

          const resizeObserver = new ResizeObserver(() => {
            map.invalidateSize();
          });
          resizeObserver.observe(mapContainerRef.current);
        }
      }, [isAuthenticated]);

      // Ensure map always recalculates full screen tiles on data updates
      useEffect(() => {
        if (mapInstanceRef.current) {
          const timer = setTimeout(() => {
            mapInstanceRef.current.invalidateSize();
          }, 250);
          return () => clearTimeout(timer);
        }
      }, [jobs, searchCoords, activeTab, sidebarWidth, isSidebarCollapsed]);

      // Candidates with organic, non-overlapping geographic dispersion spread around their city hub
      const spreadCandidates = useMemo(() => {
        const cityMap = {};
        candidates.forEach(cand => {
          if (!cand.coords || !Array.isArray(cand.coords) || typeof cand.coords[0] !== 'number' || isNaN(cand.coords[0]) || typeof cand.coords[1] !== 'number' || isNaN(cand.coords[1])) return;
          const key = `${cand.coords[0].toFixed(3)},${cand.coords[1].toFixed(3)}`;
          if (!cityMap[key]) cityMap[key] = [];
          cityMap[key].push(cand);
        });

        return candidates.map(cand => {
          if (!cand.coords || !Array.isArray(cand.coords) || typeof cand.coords[0] !== 'number' || isNaN(cand.coords[0]) || typeof cand.coords[1] !== 'number' || isNaN(cand.coords[1])) {
            return { ...cand, spreadCoords: null };
          }
          const key = `${cand.coords[0].toFixed(3)},${cand.coords[1].toFixed(3)}`;
          const group = cityMap[key] || [cand];
          const index = group.findIndex(c => c.id === cand.id);
          const totalInCity = group.length;

          // Deterministic hash based on ID and name
          let hash = 0;
          const str = (cand.id || '') + (cand.name || '');
          for (let j = 0; j < str.length; j++) {
            hash = (hash << 5) - hash + str.charCodeAt(j);
            hash |= 0;
          }
          hash = Math.abs(hash);

          const [baseLat, baseLng] = cand.coords;
          let spreadCoords;

          if (totalInCity <= 1) {
            spreadCoords = cand.coords;
          } else {
            // Golden angle spiral (137.5 deg) gives maximum non-overlapping dispersion
            const angle = (index * 2.39996) + ((hash % 100) / 100) * 0.45;
            // Radius spreads outward from ~0.6 km to ~3.8 km based on candidate count
            const radiusKm = 0.55 + (0.5 * Math.sqrt(index)) + ((hash % 60) / 100) * 0.35;

            let latOffset = (radiusKm / 111.0) * Math.cos(angle);
            const lngOffset = (radiusKm / (111.0 * Math.cos(baseLat * (Math.PI / 180)))) * Math.sin(angle);

            // In Toronto (where south is Lake Ontario), bias slightly northwards to keep on land
            if (baseLat >= 43.6 && baseLat <= 43.72 && baseLng >= -79.55 && baseLng <= -79.25) {
              if (latOffset < -0.008) {
                latOffset = Math.abs(latOffset) * 0.55;
              }
            }

            spreadCoords = [
              Math.round((baseLat + latOffset) * 100000) / 100000,
              Math.round((baseLng + lngOffset) * 100000) / 100000
            ];
          }

          return {
            ...cand,
            spreadCoords,
            cityCandidates: group
          };
        });

        if (!hasInitiallyFittedRef.current && !searchCoords && !selectedJob && !selectedCandidateGroup) {

      }, [processedJobs, spreadCandidates, selectedJob, selectedCandidateGroup, pinnedCandidateId, showJobsLayer, showCandidatesLayer, searchCoords, isAuthenticated]);

      // 4. Geocode Location Search (Multi-stage fallback for partial & full addresses)
      const handleLocationSearch = async (e) => {
        if (e) e.preventDefault();
        const query = searchQuery.trim();
        setSearchError(null);

        if (!query) {
          setSearchCoords(null);
          setSearchAddressName('');
          if (searchMarkerRef.current && mapInstanceRef.current) {
            mapInstanceRef.current.removeLayer(searchMarkerRef.current);
            searchMarkerRef.current = null;

          if (radiusCircleRef.current && mapInstanceRef.current) {
            mapInstanceRef.current.removeLayer(radiusCircleRef.current);
            radiusCircleRef.current = null;
          }
          return;
        }

        if (isSearchingLocation) return;
        setIsSearchingLocation(true);
        const map = mapInstanceRef.current;

        try {
          const cleanQuery = query.toLowerCase().trim();
          let coords = null;
          let displayName = query;

          // 1. Check persistent geocache
          try {
            const cache = JSON.parse(localStorage.getItem('tttg_geo_cache') || '{}');
            if (cache[cleanQuery] || cache[query]) {
              coords = cache[cleanQuery] || cache[query];
              displayName = query;
            }
          } catch (e) {}

          // 2. Check built-in city coordinates
          if (!coords) {
            for (const [key, val] of Object.entries(CITY_COORDINATES)) {
              if (cleanQuery === key || cleanQuery === `${key}, on` || cleanQuery === `${key}, ontario` || cleanQuery === `${key}, ca`) {
                coords = val;
                displayName = key.toUpperCase();
                break;
              }
            }
          }

          // 3. Check partial city in query if not a specific street number
          if (!coords && !/\d+/.test(cleanQuery)) {
            for (const [key, val] of Object.entries(CITY_COORDINATES)) {
              if (cleanQuery.includes(key) || key.includes(cleanQuery)) {
                coords = val;
                displayName = key.toUpperCase();
                break;
              }
            }
          }

          // 4. Multi-stage Nominatim Search (handles full street address and partial queries)
          if (!coords) {
            const queriesToTry = [
              query,
              !/(on|ontario|ca|california|mi|michigan|ny|tx|fl|qc|bc|alberta)/i.test(query) ? `${query}, Ontario, Canada` : null,
              !/(canada|usa|us)/i.test(query) ? `${query}, Canada` : null
            ].filter(Boolean);

            for (const q of queriesToTry) {
              try {
                const nominatimUrl = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ca,us&q=${encodeURIComponent(q)}`;
                const res = await fetch(nominatimUrl, { headers: { 'Accept-Language': 'en' } });
                if (res.ok) {
                  const data = await res.json();
                  if (Array.isArray(data) && data.length > 0) {
                    coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                    displayName = data[0].display_name.split(',').slice(0, 3).join(',').trim();
                    
                    // Save to persistent cache
                    try {
                      const cache = JSON.parse(localStorage.getItem('tttg_geo_cache') || '{}');
                      cache[cleanQuery] = coords;
                      cache[query] = coords;
                      localStorage.setItem('tttg_geo_cache', JSON.stringify(cache));
                    } catch (e) {}
                    break;
                  }
                }
              } catch (fetchErr) {
                console.warn('Nominatim lookup notice for', q, fetchErr);
              }
            }
          }

          if (coords) {
            setSearchCoords(coords);
            setSearchAddressName(displayName);
            setSearchError(null);

            if (map) {
              try {
                if (searchMarkerRef.current) map.removeLayer(searchMarkerRef.current);
                if (radiusCircleRef.current) map.removeLayer(radiusCircleRef.current);

                const searchIcon = L.divIcon({
                  html: `
                    <div class="relative flex items-center justify-center">
                      <div class="w-8 h-8 rounded-full bg-stone-900 border-2 border-white shadow-xl flex items-center justify-center text-white text-xs font-bold candidate-pulse">
                        📍
                      </div>
                    </div>
                  `,
                  className: 'search-user-marker',
                  iconSize: [32, 32],
                  iconAnchor: [16, 16]

                searchMarkerRef.current = L.marker(coords, { icon: searchIcon, zIndexOffset: 1000 })
                  .bindTooltip(`<b>Candidate Location</b><br/>${displayName}`, { permanent: true, direction: 'bottom', offset: [0, 10], className: 'custom-tooltip' })
                  .addTo(map);

                if (maxRadius !== 'ALL') {
                  const radiusMeters = parseInt(maxRadius) * (unit === 'mi' ? 1609.34 : 1000);
                  radiusCircleRef.current = L.circle(coords, {
                    radius: radiusMeters,
                    color: '#2B2723',
                    fillColor: '#787165',
                    fillOpacity: 0.1,
                    weight: 1.5,
                    dashArray: '4, 6'

              } catch (mapErr) {
                console.warn('Map marker positioning notice:', mapErr);
              }

          } else {
            setSearchError(`Could not locate "${query}". Please check the address or try adding the city (e.g. "${query}, Toronto" or "${query}, ON").`);
          }
        } catch (err) {
          console.warn('Search geocode notice:', err);

        } finally {
          setIsSearchingLocation(false);
        }
      };

      // 4b. Live Address Suggestions (Uber / Google Maps style autocomplete)
      useEffect(() => {
        const query = searchQuery.trim();

        const timer = setTimeout(async () => {
          const cleanQuery = query.toLowerCase();
          const results = [];

          // 1. Instant local matching from known cities & regional hubs
          Object.keys(CITY_COORDINATES).forEach(key => {
            if (key.startsWith(cleanQuery) || key.includes(cleanQuery)) {
              results.push({
                id: `local_${key}`,
                mainText: key.toUpperCase(),
                secondaryText: 'Regional Hub',
                coords: CITY_COORDINATES[key],
                fullName: key.toUpperCase()
              });
            }
          });

          // 2. Query high-speed OSM Photon typeahead endpoint (biased towards ON / North America)
          try {
            const photonUrl = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5&lat=43.7&lon=-79.4`;
            const res = await fetch(photonUrl);
            if (res.ok) {
              const data = await res.json();
              if (data && Array.isArray(data.features)) {
                data.features.forEach(feat => {
                  const props = feat.properties || {};
                  const coords = [feat.geometry.coordinates[1], feat.geometry.coordinates[0]]; // lat, lon
                  
                  let main = props.name || props.street || props.city || query;
                  if (props.housenumber && props.street) {
                    main = `${props.housenumber} ${props.street}`;
                  }
                  
                  const subParts = [props.city || props.district || props.locality, props.state, props.country].filter(Boolean);
                  const secondary = subParts.join(', ');
                  const fullName = `${main}, ${secondary}`;

                  if (!results.some(r => r.fullName === fullName)) {
                    results.push({
                      id: `photon_${feat.properties.osm_id || Math.random()}`,
                      mainText: main,
                      secondaryText: secondary,
                      coords: coords,
                      fullName: fullName
                    });
                  }
                });
              }
            }
          } catch (e) {
            console.warn('Autocomplete fetch notice:', e);
          }

          setSuggestions(results.slice(0, 5));
          setActiveSuggestionIndex(-1);
        }, 180);

        return () => clearTimeout(timer);
      }, [searchQuery, showSuggestions]);

      // Handle selecting a suggested address from dropdown
      const handleSelectSuggestion = (item) => {
        const fullDisplay = item.mainText + (item.secondaryText ? `, ${item.secondaryText}` : '');
        setSearchQuery(fullDisplay);
        setSearchCoords(item.coords);
        setSearchAddressName(item.mainText);
        setSuggestions([]);
        setShowSuggestions(false);
        setSearchError(null);

        // Cache in persistent storage
        try {
          const cache = JSON.parse(localStorage.getItem('tttg_geo_cache') || '{}');
          cache[fullDisplay.toLowerCase()] = item.coords;
          cache[item.mainText.toLowerCase()] = item.coords;
          localStorage.setItem('tttg_geo_cache', JSON.stringify(cache));
        } catch (e) {}

        const map = mapInstanceRef.current;
        if (map) {
          try {
            if (searchMarkerRef.current) map.removeLayer(searchMarkerRef.current);
            if (radiusCircleRef.current) map.removeLayer(radiusCircleRef.current);

            const searchIcon = L.divIcon({
              html: `
                <div class="relative flex items-center justify-center">
                  <div class="w-8 h-8 rounded-full bg-stone-900 border-2 border-white shadow-xl flex items-center justify-center text-white text-xs font-bold candidate-pulse">
                    📍
                  </div>
                </div>
              `,
              className: 'search-user-marker',
              iconSize: [32, 32],
              iconAnchor: [16, 16]
            });

            searchMarkerRef.current = L.marker(item.coords, { icon: searchIcon, zIndexOffset: 1000 })
              .bindTooltip(`<b>Candidate Location</b><br/>${item.mainText}`, { permanent: true, direction: 'bottom', offset: [0, 10], className: 'custom-tooltip' })
              .addTo(map);

            if (maxRadius !== 'ALL') {
              const radiusMeters = parseInt(maxRadius) * (unit === 'mi' ? 1609.34 : 1000);
              radiusCircleRef.current = L.circle(item.coords, {
                radius: radiusMeters,
                color: '#2B2723',
                fillColor: '#787165',
                fillOpacity: 0.1,
                weight: 1.5,
                dashArray: '4, 6'
              }).addTo(map);
            }

            map.flyTo(item.coords, 10, { duration: 1 });
          } catch (err) {
            console.warn('Map marker positioning notice:', err);
          }
        }
      };

      // Close autocomplete dropdown on click outside
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (searchBoxRef.current && !searchBoxRef.current.contains(e.target)) {
            setShowSuggestions(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      // 5. Unique Owners
      const uniqueOwners = useMemo(() => {
        const ownersSet = new Set();
        jobs.forEach(j => {
          if (j['Owners']) {
            j['Owners'].split(',').forEach(o => ownersSet.add(o.trim()));
          }
        });
        return Array.from(ownersSet).sort();
      }, [jobs]);

      // 6. Filter & Sort Jobs
      const processedJobs = useMemo(() => {
        return jobs
          .map(job => {
            let distance = null;
            if (searchCoords && job.coords) {
              distance = calculateDistance(
                searchCoords[0],
                searchCoords[1],
                job.coords[0],
                job.coords[1],
                unit
              );
            }
            return { ...job, distance };
          })
          .filter(job => {
            if (keywordFilter.trim()) {
              const kw = keywordFilter.toLowerCase();
              const matchTitle = (job['Job Title'] || '').toLowerCase().includes(kw);
              const matchCompany = (job['Company'] || '').toLowerCase().includes(kw);
              const matchLoc = (job['displayLocation'] || '').toLowerCase().includes(kw);
              const matchDesc = (job['Job Description'] || '').toLowerCase().includes(kw);
              if (!matchTitle && !matchCompany && !matchLoc && !matchDesc) return false;
            }

            if (selectedOwner !== 'ALL') {
              const owners = (job['Owners'] || '').split(',').map(o => o.trim());
              if (!owners.includes(selectedOwner)) return false;
            }

            if (searchCoords && maxRadius !== 'ALL' && job.distance !== null) {
              if (job.distance > parseInt(maxRadius)) return false;
            }

            if (regionFilter === 'ONTARIO') {
              const [lat, lng] = job.coords || [0, 0];
              const isOntCoords = lat >= 41.5 && lat <= 46.5 && lng >= -84.0 && lng <= -74.0;
              const isOntText = /\b(on|ontario|toronto|windsor|mississauga|brampton|hamilton|london|kitchener|waterloo|markham|vaughan|ottawa|cambridge|guelph|barrie|oakville|burlington|oshawa|st\. catharines|peterborough|belleville|stratford|chatham|sarnia|newmarket|ajax|pickering|whitby)\b/i.test(job.displayLocation || job.rawLocation || '');
              if (!isOntCoords && !isOntText) return false;
            } else if (regionFilter === 'CANADA') {
              const [lat, lng] = job.coords || [0, 0];
              const isOntCoords = lat >= 41.5 && lat <= 46.5 && lng >= -84.0 && lng <= -74.0;
              const isCanCoords = isOntCoords || (lat >= 41.0 && lat <= 70.0 && lng >= -141.0 && lng <= -52.0);
              const isCanText = /\b(on|ontario|bc|british columbia|ab|alberta|qc|quebec|mb|manitoba|sk|saskatchewan|ns|nova scotia|nb|new brunswick|nl|newfoundland|pe|prince edward island|canada)\b/i.test(job.displayLocation || job.rawLocation || '') || /canada/i.test(job['Job Description'] || '');
              if (!isCanCoords && !isCanText) return false;
            } else if (regionFilter === 'GLOBAL') {
              const [lat, lng] = job.coords || [0, 0];
              const isOntCoords = lat >= 41.5 && lat <= 46.5 && lng >= -84.0 && lng <= -74.0;
              const isCanCoords = isOntCoords || (lat >= 41.0 && lat <= 70.0 && lng >= -141.0 && lng <= -52.0);
              const isCanText = /\b(on|ontario|bc|ab|qc|mb|sk|ns|nb|nl|pe|canada)\b/i.test(job.displayLocation || job.rawLocation || '') || /canada/i.test(job['Job Description'] || '');
              if (isCanCoords || isCanText) return false;
            }

            return true;
          })
          .sort((a, b) => {
            if (searchCoords) {
              if (a.distance === null) return 1;
              if (b.distance === null) return -1;

      }, [jobs, searchCoords, keywordFilter, selectedOwner, maxRadius, unit, regionFilter]);

      const handleSelectJob = (job) => {
        setSelectedJob(job);
        setPinnedCandidateId(null);
        setDrawerTab('role');
        setCandidateRadius('50');
        setFilterSimilarTitlesOnly(false);
        setCandidateSearchText('');
        if (connectionLineRef.current && mapInstanceRef.current) {
          mapInstanceRef.current.removeLayer(connectionLineRef.current);
          connectionLineRef.current = null;

        if (mapInstanceRef.current) {
          Object.values(candidateMarkersRef.current).forEach(m => mapInstanceRef.current.removeLayer(m));
          candidateMarkersRef.current = {};
        }

        if (job.coords && mapInstanceRef.current) {
          const currentZoom = mapInstanceRef.current.getZoom();

          const targetZoom = Math.min(Math.max(currentZoom, 8.5), 9.5);

          if (marker) {
            marker.openTooltip();
          }

      };

      // Matched candidates for the selected job, ranked by distance to this job
      const matchedCandidates = useMemo(() => {
        if (!selectedJob || !selectedJob.coords) return [];
        const [jobLat, jobLng] = selectedJob.coords;

        return spreadCandidates
          .map(cand => {
            let dist = null;
            if (cand.coords) {
              dist = calculateDistance(jobLat, jobLng, cand.coords[0], cand.coords[1], unit);
            }
            const isMatch = isSimilarTitle(selectedJob['Job Title'], cand.title, cand.notes, cand.industry);
            return {
              ...cand,
              distance: dist,
              isTitleMatch: isMatch
            };
          })
          .filter(cand => {
            // Radius filter
            if (candidateRadius !== 'ALL') {
              const maxR = parseFloat(candidateRadius);
              if (cand.distance === null || cand.distance > maxR) return false;
            }
            // Title filter
            if (filterSimilarTitlesOnly && !cand.isTitleMatch) {
              return false;
            }
            // Search text filter
            if (candidateSearchText.trim()) {
              const q = candidateSearchText.toLowerCase().trim();
              const fullText = `${cand.name} ${cand.title} ${cand.location} ${cand.company} ${cand.notes} ${cand.industry}`.toLowerCase();
              if (!fullText.includes(q)) return false;
            }
            return true;
          })
          .sort((a, b) => {
            if (a.distance !== null && b.distance !== null) return a.distance - b.distance;
            if (a.distance !== null) return -1;
            if (b.distance !== null) return 1;
            return 0;
          });
      }, [selectedJob, spreadCandidates, candidateRadius, filterSimilarTitlesOnly, candidateSearchText, unit]);

      // Candidates inside the selected candidate city cluster, filtered by city text search
      const filteredCityCandidates = useMemo(() => {
        if (!selectedCandidateGroup) return [];
        let list = selectedCandidateGroup.candidates || [];
        if (candidateCityFilterText.trim()) {
          const q = candidateCityFilterText.toLowerCase().trim();
          list = list.filter(c => {
            const str = `${c.name} ${c.title} ${c.company} ${c.notes} ${c.industry} ${c.compensationTarget}`.toLowerCase();
            return str.includes(q);
          });
        }
        if (selectedCandidateGroup.selectedCandidateId) {
          list = [...list].sort((a, b) => {
            if (a.id === selectedCandidateGroup.selectedCandidateId) return -1;
            if (b.id === selectedCandidateGroup.selectedCandidateId) return 1;
            return 0;
          });
        }
        return list;
      }, [selectedCandidateGroup, candidateCityFilterText]);

      // Pin a candidate on the map and draw connection line to the current job
      const handlePinCandidateOnMap = (cand) => {
        const map = mapInstanceRef.current;
        const targetCoords = cand.spreadCoords || cand.coords;
        if (!map || !targetCoords) return;

        setPinnedCandidateId(cand.id);

        // Remove previous polyline and candidate markers
        if (connectionLineRef.current) {
          map.removeLayer(connectionLineRef.current);
          connectionLineRef.current = null;
        }
        Object.values(candidateMarkersRef.current).forEach(m => map.removeLayer(m));
        candidateMarkersRef.current = {};

        // Place Candidate Marker using identical size & styling
        const candIcon = L.divIcon({
          html: `
            <div class="relative cursor-pointer select-none flex flex-col items-center justify-center transition-transform hover:scale-110">
              <div class="w-8 h-8 rounded-full bg-white border-2 border-stone-800 shadow-xl flex items-center justify-center p-1.5 candidate-pin-glow">
                <img src="./candidate-pin.png" class="w-full h-full object-contain filter drop-shadow-sm" alt="${cand.name}" />
              </div>
              <span class="w-1.5 h-1.5 rounded-full bg-stone-900 mt-0.5 ring-2 ring-white shadow"></span>
            </div>
          `,
          className: 'custom-candidate-pin',
          iconSize: [32, 32],
          iconAnchor: [16, 16],
          popupAnchor: [0, -18]

        const candMarker = L.marker(targetCoords, { icon: candIcon });

          <div class="px-1.5 py-1">
            <p class="font-bold text-stone-900 text-xs">${cand.name}</p>
            <p class="text-stone-600 text-[11px] font-medium">${cand.title}</p>
            <p class="text-stone-500 text-[10px] mt-0.5">📌 ${cand.location}</p>
            ${cand.company ? `<p class="text-stone-400 text-[9px]">${cand.company}</p>` : ''}
          </div>
        `, { direction: 'top', offset: [0, -18], opacity: 0.98, className: 'leaflet-popup-content-wrapper p-2' });

        candMarker.addTo(map);
        candidateMarkersRef.current[cand.id] = candMarker;

        // Draw connecting polyline between job and candidate spread position
        if (selectedJob && selectedJob.coords) {
          const line = L.polyline([selectedJob.coords, targetCoords], {
            color: '#1C1916',
            weight: 2.5,
            dashArray: '6, 8',
            opacity: 0.85

            permanent: true,
            direction: 'center',
            className: 'distance-midpoint-tooltip'
          });
          connectionLineRef.current = line;

          map.fitBounds([selectedJob.coords, targetCoords], { padding: [80, 80], maxZoom: 12 });
        } else {
          map.setView(targetCoords, 10);
        }

      const copyCandidatePitch = (cand) => {

          `Role: ${cand.title}`,
          `Location: ${cand.location}`,
          cand.company ? `Current Company: ${cand.company}` : '',
          cand.compensationTarget ? `Compensation Target: ${cand.compensationTarget}` : '',
          cand.industry ? `Industry: ${cand.industry}` : '',
          cand.notes ? `Notes / Focus: ${cand.notes}` : '',
          cand.submissionLink ? `Profile Link: ${cand.submissionLink}` : ''
        ].filter(Boolean);

        const pitch = lines.join('\n');
        navigator.clipboard.writeText(pitch);
        setCopiedId(cand.id);
        setTimeout(() => setCopiedId(null), 2500);
      };

      // Geolocation handler for "My Location" (with Toronto, ON fallback)
      const handleFocusMyLocation = () => {

          if (mapInstanceRef.current) {
            mapInstanceRef.current.setView([43.6532, -79.3832], 9.5, { animate: true });
          }
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const coords = [pos.coords.latitude, pos.coords.longitude];
            setUserLocation(coords);
            if (mapInstanceRef.current) {
              mapInstanceRef.current.setView(coords, 10, { animate: true });
              if (userMarkerRef.current) {
                mapInstanceRef.current.removeLayer(userMarkerRef.current);
              }
              const userIcon = L.divIcon({
                html: `
                  <div class="relative flex items-center justify-center">
                    <div class="w-4 h-4 rounded-full bg-blue-600 border-2 border-white shadow-lg candidate-pulse"></div>
                  </div>
                `,
                className: 'user-location-pin',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
              });
              userMarkerRef.current = L.marker(coords, { icon: userIcon })
                .bindTooltip('📍 Your Current Location', { direction: 'top', offset: [0, -10] })
                .addTo(mapInstanceRef.current);
            }
          },
          (err) => {
            console.warn('Geolocation lookup notice, centering on Toronto, ON:', err);
            if (mapInstanceRef.current) {
              mapInstanceRef.current.setView([43.6532, -79.3832], 9.5, { animate: true });
            }
          },
          { enableHighAccuracy: true, timeout: 8000 }

                        setSearchAddressName(selectedCandidateGroup.cityName);
                        setSearchQuery(selectedCandidateGroup.cityName);
                        if (isSidebarCollapsed) setIsSidebarCollapsed(false);
                      }}
                      className="w-full bg-stone-900 hover:bg-stone-800 text-white px-3 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition shadow-sm"
                    >
                      <span>📍</span>
                      <span>Rank All Active Jobs Nearest to {selectedCandidateGroup.cityName}</span>
                    </button>
                  </div>

                  {/* Quick Filter Input within City */}
                  <div className="p-3 border-b border-stone-100 bg-white shrink-0">
                    <div className="relative">
                      <input
                        type="text"
                        placeholder="Filter candidates by name, title, skill..."
                        value={candidateCityFilterText}
                        onChange={(e) => setCandidateCityFilterText(e.target.value)}
                        className="w-full pl-7 pr-7 py-1.5 bg-stone-50 border border-stone-200 rounded-lg text-xs placeholder-stone-400 focus:outline-none focus:border-stone-800"
                      />
                      <span className="absolute left-2.5 top-2 text-[10px] text-stone-400">🔍</span>
                      {candidateCityFilterText && (
                        <button
                          onClick={() => setCandidateCityFilterText('')}
                          className="absolute right-2 top-1.5 text-xs text-stone-400 hover:text-stone-700"
                        >
                          ✕
                        </button>
                      )}
                    </div>
                  </div>

                  {/* Scrollable Candidates List */}
                  <div className="p-4 overflow-y-auto space-y-3 text-xs text-stone-700 flex-1 custom-scrollbar">
                    {filteredCityCandidates.length === 0 ? (
                      <div className="py-12 text-center text-stone-400 space-y-2">
                        <p className="text-2xl">🌿</p>
                        <p className="text-sm font-semibold text-stone-800">No candidates match search</p>
                        <p className="text-xs text-stone-500">Try clearing the search filter above.</p>
                      </div>
                    ) : (
                      filteredCityCandidates.map((cand) => {
                        const isSelectedFromMap = selectedCandidateGroup && selectedCandidateGroup.selectedCandidateId === cand.id;
                        return (
                          <div
                            key={cand.id}
                            className={`p-3.5 rounded-2xl border transition space-y-2 ${
                              isSelectedFromMap
                                ? 'border-stone-900 bg-stone-50 ring-2 ring-stone-900 shadow-md'
                                : 'border-stone-200/80 bg-white hover:border-stone-400 shadow-sm'
                            }`}
                          >
                          {/* Name & Title */}
                          <div className="flex items-start justify-between gap-2">
                            <div className="flex-1 pr-1">
                              <h5 className="font-bold text-xs text-stone-900">{cand.name}</h5>
                              <p className="text-[11px] font-semibold text-stone-700 mt-0.5">{cand.title}</p>
                            </div>
                            {cand.compensationTarget && (
                              <span className="bg-emerald-50 border border-emerald-200 text-emerald-800 text-[10px] px-2 py-0.5 rounded-md font-semibold shrink-0">
                                💰 {cand.compensationTarget}
                              </span>
                            )}
                          </div>

                          {/* Zero-Clutter Details: Strictly omit empty fields */}
                          <div className="space-y-1 text-[11px]">
                            {cand.company && (
                              <p className="text-stone-600">
                                🏢 Company: <span className="font-medium text-stone-800">{cand.company}</span>
                              </p>
                            )}

                            {cand.industry && (
                              <p className="text-stone-600">
                                🏭 Industry: <span className="font-normal">{cand.industry}</span>
                              </p>
                            )}

                            {cand.notes && (
                              <div className="p-2 rounded-xl text-[10px] bg-stone-50 border border-stone-200/60 text-stone-600 leading-relaxed">
                                <b>Notes / Target:</b> {cand.notes}
                              </div>
                            )}

                            {cand.shift && (
                              <p className="text-stone-500 text-[10px]">⏱️ Shift: {cand.shift}</p>
                            )}

                          </div>

                          {/* Action Buttons */}
                          <div className="pt-2 border-t border-stone-100 flex items-center justify-between text-xs">
                            <button
                              onClick={() => copyCandidatePitch(cand)}
                              className="text-[11px] bg-stone-100 hover:bg-stone-200 text-stone-800 px-2.5 py-1 rounded-lg border border-stone-200 font-medium transition flex items-center gap-1"
                            >
                              <span>📋</span>
                              <span>{copiedId === cand.id ? '✓ Pitch Copied' : 'Copy Pitch'}</span>
                            </button>

                            {cand.submissionLink && (
                              <a
                                href={cand.submissionLink}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="text-[11px] font-semibold text-blue-500 hover:underline"
                              >
                                Profile &rarr;
                              </a>
                            )}
                          </div>

                        </div>
                      );
                    })
                  )}
                  </div>

                  {/* Drawer Footer Actions */}
                  <div className="p-3 border-t border-stone-100 bg-stone-50 flex items-center justify-between gap-2 shrink-0">
                    <span className="text-[11px] text-stone-500">
                      Showing {filteredCityCandidates.length} candidate{filteredCityCandidates.length !== 1 ? 's' : ''} in {selectedCandidateGroup.cityName}
                    </span>
                    <button
                      onClick={() => setSelectedCandidateGroup(null)}
                      className="text-stone-600 hover:text-stone-900 text-xs font-semibold px-2.5 py-1 rounded-lg border border-stone-200 hover:bg-stone-100 transition"
                    >
                      Close
                    </button>
                  </div>

                </div>
              )}

            </div>

          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
