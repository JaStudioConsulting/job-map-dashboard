  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    function CopyButton({ onCopy, copied, label, className = '' }) {
      const [failed, setFailed] = useState(false);
      return (
        <button type="button" aria-label={label} title={failed ? 'Copy failed. Please try again.' : copied ? 'Copied' : label}
          className={`copy-control ${className}`}
          onClick={async (event) => {
            event.stopPropagation();
            try { await onCopy(); setFailed(false); }
            catch { setFailed(true); }
          }}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            {copied ? <path d="m5 12 4 4 10-10" /> : <><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" /></>}
          </svg>
          <span className="sr-only" role="status">{failed ? 'Copy failed. Please try again.' : copied ? 'Copied to clipboard' : ''}</span>
        </button>
      );
    }

    const PERSON_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3z"/></svg>';
    const createCandidateIcon = (isPinned = false) => L.divIcon({
      html: `<div class="person-marker ${isPinned ? 'is-pinned' : ''}">${PERSON_SVG}</div>`,
      className: 'custom-candidate-pin', iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16]
    });
    const validCoords = coords => Array.isArray(coords) && coords.length >= 2 &&
      Number.isFinite(coords[0]) && Number.isFinite(coords[1]) && Math.abs(coords[0]) <= 90 && Math.abs(coords[1]) <= 180;
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'}[char]));

    const safeReviewUrl = value => {
      try {
        const url = new URL(String(value || '').trim());
        return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
      } catch { return ''; }
    };
    function getCandidateLinks(row) {
      const explicit = row['Submission Email Link'] || row['Submission Email URL'] || row['Email Link'] || row['Submission Link'] || row.submissionLink;
      const generic = safeReviewUrl(row['Link']);
      const isMail = generic && /^(?:mail\.google\.com|outlook\.(?:office\.com|office365\.com|live\.com|cloud\.microsoft))$/.test(new URL(generic).hostname);
      return {
        submissionLink: safeReviewUrl(explicit) || (isMail ? generic : ''),
        profileLink: safeReviewUrl(row['Profile Link'] || row.profileLink) || (!isMail ? generic : '')
      };
    }
    const normalizeIdentity = value => String(value || '').normalize('NFC').toLowerCase().trim().replace(/\s+/g, ' ');
    function attachTrackerSubmissions(candidates, rows) {
      if (rows.length && (!Object.hasOwn(rows[0], 'Candidate Name') || !Object.hasOwn(rows[0], 'Submission Link'))) {
        throw new Error('The Tracker tab must contain Candidate Name and Submission Link columns.');
      }
      const byName = new Map();
      rows.forEach(row => {
        const url = safeReviewUrl(row['Submission Link']);
        const key = normalizeIdentity(row['Candidate Name']);
        if (!key || !url) return;
        const record = {
          url,
          title: row['Current / Most Recent Title'] || row['Current Title'] || '',
          company: row['Current / Most Recent Company'] || row['Current Company'] || row['Company'] || '',
          client: row['Client Submitted To'] || row['Submitted To'] || '',
          date: row['Submission Date'] || row['Submitted On'] || '',
          role: row['Role Submitted For'] || ''
        };
        if (!byName.has(key)) byName.set(key, []);
        byName.get(key).push(record);
      });
      return candidates.map(candidate => {
        const sourceRows = byName.get(normalizeIdentity(candidate.name)) || [];
        const compatible = sourceRows.filter(row =>
          (!candidate.title || !row.title || normalizeIdentity(candidate.title) === normalizeIdentity(row.title)) &&
          (!candidate.company || !row.company || normalizeIdentity(candidate.company) === normalizeIdentity(row.company)));
        const identities = new Set(compatible.map(row => `${normalizeIdentity(row.title)}|${normalizeIdentity(row.company)}`));
        const ambiguous = identities.size > 1;
        const seen = new Set();
        const submissionEmails = (ambiguous ? [] : compatible).filter(row => {
          if (seen.has(row.url)) return false;
          seen.add(row.url);return true;
        });
        if (candidate.submissionLink && !seen.has(candidate.submissionLink)) {
          submissionEmails.push({url:candidate.submissionLink, client:candidate.submittedTo, date:candidate.submittedOn, role:''});
        }
        return {...candidate, submissionEmails, submissionReviewStatus: ambiguous ? 'ambiguous' : submissionEmails.length ? 'available' : 'missing'};
      });
    }
    function CandidateSubmissionLink({ candidate }) {
      const emails = candidate.submissionEmails || (candidate.submissionLink ? [{url:candidate.submissionLink, client:candidate.submittedTo, date:candidate.submittedOn}] : []);
      return (
        <div className="mt-2 space-y-2 text-[11px]">
          {emails.length ? emails.map((email, index) => (
            <div key={email.url} className="space-y-1">
              {email.client && <p>Submitted to: {email.client}</p>}
              {email.role && <p>Submitted for: {email.role}</p>}
              {email.date && <p>Submitted on: {email.date}</p>}
              <a href={email.url} target="_blank" rel="noopener noreferrer"
                className="inline-flex items-center gap-1 font-semibold text-stone-900 underline underline-offset-2 hover:no-underline">
                ✉ Review submission email{emails.length > 1 ? ` ${index + 1}` : ''} ↗
              </a>
            </div>
          )) : <p className="text-stone-500">{candidate.submissionReviewStatus === 'ambiguous' ? 'Tracker identity needs review before linking an email' : 'Submission email link not provided'}</p>}
          {candidate.profileLink && <a href={candidate.profileLink} target="_blank" rel="noopener noreferrer"
            className="block text-stone-900 underline underline-offset-2 hover:no-underline">View profile ↗</a>}
        </div>
      );
    }

      {label:'retail', pattern:/\b(?:retail|e commerce|ecommerce)\b/},
      {label:'hospitality', pattern:/\b(?:hospitality|hotels?|restaurants?)\b/},
      {label:'energy', pattern:/\b(?:energy|oil and gas|utilities|renewables)\b/},
      {label:'software', pattern:/\b(?:software|saas|information technology)\b/}
    ];
    const normalizeMatchText = value => String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    const titleProfiles = title => {
      const found = ROLE_PROFILES.filter(profile => profile.pattern.test(normalizeMatchText(title)));
      const businessRoles = found.filter(profile => ['sales','marketing','procurement','accounting','finance'].includes(profile.id));
      if (businessRoles.length) return businessRoles;
      return found.some(profile => profile.id !== 'engineering') ? found.filter(profile => profile.id !== 'engineering') : found;
    };
    function getCandidateRelevance(job, cand) {
      const jobTitle = normalizeMatchText(job['Job Title']);
      const candTitle = normalizeMatchText(cand.title);
      if (jobTitle && candTitle && jobTitle === candTitle) {
        return {matchTier:0, matchLabel:'Role match', matchReason:'Same job title'};
      }
      const jobRoles = titleProfiles(jobTitle);
      const candidateRoles = titleProfiles(candTitle);
      const shared = jobRoles.find(role => candidateRoles.some(other => other.id === role.id));
      if (shared) {
        const engineeringMismatch = /\bengineer(?:ing)?s?\b/.test(jobTitle) !== /\bengineer(?:ing)?s?\b/.test(candTitle);
        return engineeringMismatch
          ? {matchTier:1, matchLabel:'Similar role', matchReason:`Related technical field: ${shared.label}`}
          : {matchTier:0, matchLabel:'Role match', matchReason:`Title indicates ${shared.label}`};
      }
      // Support unlisted titles without treating generic seniority words as a profession.
      const generic = new Set(['senior','junior','lead','manager','supervisor','director','technician','specialist','operator','assistant','associate','staff','worker','general','chief','head','and','of','the']);
      const titleTerms = jobTitle.split(' ').filter(word => word.length > 2 && !generic.has(word));
      if (!jobRoles.length && titleTerms.length && titleTerms.every(word => candTitle.split(' ').includes(word))) {
        return {matchTier:0, matchLabel:'Role match', matchReason:'Job title keywords match'};
      }
      const related = jobRoles.find(role => candidateRoles.some(other => role.related.includes(other.id)));
      if (related) return {matchTier:1, matchLabel:'Similar role', matchReason:`Related trade or role: ${candidateRoles.find(other => related.related.includes(other.id)).label}`};
      // Explicit background can suggest a role but never promotes an unrelated current title to a role match.
      const background = normalizeMatchText(`${cand.notes || ''} ${cand.licenses || ''}`);
      const backgroundRole = jobRoles.find(role => role.pattern.test(background));
      if (backgroundRole) return {matchTier:1, matchLabel:'Related background', matchReason:`Notes or certifications mention ${backgroundRole.label}`};
      const jobIndustry = normalizeMatchText(`${job['Industry'] || ''} ${job['Job Description'] || ''}`);
      const candidateIndustry = normalizeMatchText(cand.industry);
      const sector = INDUSTRY_PROFILES.find(profile => profile.pattern.test(jobIndustry) && profile.pattern.test(candidateIndustry));
      if (sector) return {matchTier:2, matchLabel:'Related industry', matchReason:`Shared industry: ${sector.label}`};
      return null;
    }

    // --- HAVERSINE DISTANCE FORMULA ---
    function calculateDistance(lat1, lon1, lat2, lon2, unit = 'km') {
      const R = unit === 'mi' ? 3958.8 : 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) *
        Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c * 10) / 10;
    }

    // Stable 0..1 value from a string seed (so a candidate lands the same spot every load)
    function seededUnit(seed) {
      let h = 2166136261 >>> 0;
      const s = String(seed);
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      return (h >>> 0) / 4294967296;
    }
    // Scatter a point evenly inside a circle of maxKm around baseCoords, seeded so it is stable
    function scatterWithinCity(baseCoords, seed, maxKm = 7) {
      const u1 = seededUnit(seed + ':r');
      const u2 = seededUnit(seed + ':a');
      const r = Math.sqrt(u1) * maxKm;           // sqrt = even spread across the area
      const theta = u2 * 2 * Math.PI;
      const lat = baseCoords[0];
      const dLat = (r / 111) * Math.cos(theta);
      const dLng = (r / (111 * Math.cos(lat * Math.PI / 180))) * Math.sin(theta);
      return keepOffLakeOntario([lat + dLat, baseCoords[1] + dLng], baseCoords);
    }
    // Rough Lake Ontario shorelines (Hamilton to Cobourg) as [lng, lat], so GTA scatter never lands in the lake.
    const LAKE_ONTARIO_NORTH = [[-79.88,43.29],[-79.80,43.322],[-79.71,43.395],[-79.666,43.443],[-79.585,43.548],[-79.535,43.585],[-79.47,43.625],[-79.415,43.628],[-79.38,43.64],[-79.30,43.665],[-79.25,43.69],[-79.20,43.72],[-79.14,43.77],[-79.09,43.81],[-79.02,43.83],[-78.94,43.855],[-78.84,43.87],[-78.69,43.88],[-78.55,43.89],[-78.29,43.945],[-78.17,43.955]];
    const LAKE_ONTARIO_SOUTH = [[-79.88,43.27],[-79.79,43.27],[-79.75,43.24],[-79.63,43.22],[-79.56,43.21],[-79.45,43.19],[-79.26,43.20],[-79.07,43.26],[-78.90,43.30],[-78.17,43.30]];
    const shoreLatAt = (line, lng) => {
      for (let i = 1; i < line.length; i++) {
        const [x0, y0] = line[i - 1], [x1, y1] = line[i];
        if (lng <= x1) return y0 + (y1 - y0) * ((lng - x0) / (x1 - x0));
      }
      return line[line.length - 1][1];
    };
    function keepOffLakeOntario(point, baseCoords) {
      const [lat, lng] = point;
      if (lng < -79.88 || lng > -78.17) return point;
      const north = shoreLatAt(LAKE_ONTARIO_NORTH, lng), south = shoreLatAt(LAKE_ONTARIO_SOUTH, lng);
      if (lat <= south || lat >= north) return point;
      // Mirror back across the shore on the city's side (north shore for GTA, south shore for Niagara and Hamilton).
      return baseCoords[0] >= north - 0.02 ? [north + (north - lat) + 0.003, lng] : [south - (lat - south) - 0.003, lng];
    }

    // --- ROBUST CSV PARSER ---
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(cell);
          cell = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(cell);
          if (row.length > 0 && row.some(c => c.trim() !== '')) {
            lines.push(row);
          }
          row = [];
          cell = '';
        } else {
          cell += char;
        }
      }
      if (cell !== '' || row.length > 0) {
        row.push(cell);
        lines.push(row);
      }

      if (lines.length < 2) return [];
      const headers = lines[0].map(h => h.trim().replace(/^"|"$/g, ''));
      return lines.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = (r[idx] || '').trim();
        });
        return obj;
      });
    }

    // Splits multi-location strings by common delimiters (/, ;, |, newlines, &, and)
    function splitLocationString(rawLoc) {
      if (!rawLoc || typeof rawLoc !== 'string') return [];
      const text = rawLoc.trim();
      if (!text) return [];

      let parts = [];
      if (/[\/;|\n\r]+/.test(text)) {
        parts = text.split(/[\/;|\n\r]+/).map(s => s.trim()).filter(Boolean);
      } else if (/\s+and\s+|\s+&\s+/i.test(text) && (text.includes(',') || text.includes('ON') || text.includes('CA') || text.includes('MI'))) {
        parts = text.split(/\s+and\s+|\s+&\s+/i).map(s => s.trim()).filter(Boolean);
      } else {
        const provinceMatches = text.match(/(?:[A-Za-z0-9\s.-]+,\s*(?:ON|Ontario|BC|AB|QC|MB|SK|NS|NB|NL|PE|CA|California|MI|Michigan|OH|NY|TX|FL|[A-Z]{2}))/gi);
        if (provinceMatches && provinceMatches.length > 1) {
          parts = provinceMatches.map(s => s.trim()).filter(Boolean);
        } else {
          parts = [text];
        }
      }
      return parts.length > 0 ? parts : [text];
    }

    // Normalizes location text and resolves coordinates (with localStorage cache & exact address fuzzy lookup)
    function resolveCoordinates(locationStr, jobDescription = '') {
      if (!locationStr || locationStr.trim() === '') {
        const match = jobDescription.match(/Location:\s*([^\r\n,]+(?:,\s*[^\r\n]+)?)/i);
        if (match && match[1]) {
          locationStr = match[1].trim();
        }
      }

      if (!locationStr) return null;

      // 1. Check persistent localStorage geocache
      try {
        const cache = JSON.parse(localStorage.getItem('tttg_geo_cache') || '{}');
        if (cache[locationStr]) {
          return { latLng: cache[locationStr], resolvedName: locationStr, isExact: true };
        }
      } catch (e) {}

      const cleaned = locationStr.toLowerCase().replace(/[^\w\s,]/g, '').trim();

      // 2. Exact match in built-in city coordinates
      if (CITY_COORDINATES[cleaned]) {
        return { latLng: CITY_COORDINATES[cleaned], resolvedName: locationStr, isExact: false };
      }

      // 3. Substring match for city in exact address (e.g. "4500 Rhodes Dr, Windsor, ON")
      for (const [key, coords] of Object.entries(CITY_COORDINATES)) {
        if (cleaned.includes(key) || key.includes(cleaned)) {
          return { latLng: coords, resolvedName: locationStr, isExact: false };
        }
      }

      return null;
    }

    // Candidate locations are city + province only. Province-only rows get a clearly approximate province point.
    const PROVINCE_CENTERS = {
      on: [49.25, -84.5], qc: [52.0, -72.0], bc: [53.7, -127.6], ab: [54.5, -115.0], mb: [54.5, -97.5],
      sk: [54.0, -106.0], ns: [45.1, -63.0], nb: [46.5, -66.2], nl: [53.1, -57.7], pe: [46.4, -63.2]
    };
    const PROVINCE_ALIASES = { ontario:'on', quebec:'qc', 'british columbia':'bc', alberta:'ab', manitoba:'mb', saskatchewan:'sk',
      'nova scotia':'ns', 'new brunswick':'nb', newfoundland:'nl', 'prince edward island':'pe' };
    const PROVINCE_RE = /,\s*(on|qc|bc|ab|mb|sk|ns|nb|nl|pe)\b|\b(ontario|quebec|british columbia|alberta|manitoba|saskatchewan|nova scotia|new brunswick|newfoundland|prince edward island)\b/;
    // First place-like segment of a free-text candidate location, normalized to the CITY_COORDINATES key shape.
    const primaryCityKey = loc => String(loc || '')
      .split(/\s*[|(;\/\n]\s*|\s*-\s+|\s+-\s*|(?<!\b(?:st|ste|mt))\.\s+|[,\s]\s*(?:open|willing|relocat\w*|currently|but|comfortable|prefers|preferably|lives|drives|looking|would|flexible|realistic|commut\w*|g licence)\b/i)[0]
      .toLowerCase().replace(/^(?:currently based in|currently in|based in|lives in|resides in)\s+/, '')
      .replace(/[^\w\s,]/g, ' ').replace(/\s+/g, ' ').replace(/\s*,\s*/g, ', ').trim()
      .replace(/^([a-z ]+?),? (on|ontario|qc|quebec|bc|ab|alberta|mb|sk|ns|nova scotia|nb|nl|pe)$/, (m, city, prov) => `${city}, ${PROVINCE_ALIASES[prov] || prov}`)
      .replace(/, canada$/, '').replace(/ area(?=,|$)/, '').replace(/ [a-z]\d[a-z] ?\d[a-z]\d$/, '').trim();
    function resolveCandidateLocation(loc) {
      const key = primaryCityKey(loc);
      if (!key) return { coords: null, approxLevel: null, cityKey: '' };
      if (CITY_COORDINATES[key]) return { coords: CITY_COORDINATES[key], approxLevel: 'city', cityKey: key };
      try {
        const cached = JSON.parse(localStorage.getItem('tttg_geo_cache') || '{}')[`cand:${key}`];
        if (validCoords(cached)) return { coords: cached, approxLevel: 'city', cityKey: key };
      } catch (e) {}
      if (key.length >= 4) {
        const hit = Object.keys(CITY_COORDINATES).find(k => k.startsWith(`${key},`) || key.startsWith(`${k.split(',')[0]},`));
        if (hit) return { coords: CITY_COORDINATES[hit], approxLevel: 'city', cityKey: key };
      }
      const legacy = resolveCoordinates(loc);
      if (legacy) return { coords: legacy.latLng, approxLevel: 'city', cityKey: key };
      const prov = String(loc).toLowerCase().match(PROVINCE_RE);
      const code = prov && (prov[1] || PROVINCE_ALIASES[prov[2]]);
      return { coords: code ? PROVINCE_CENTERS[code] : null, approxLevel: code ? 'province' : null, cityKey: key, needsGeocode: true };
    }

    // --- JSONP GOOGLE SHEETS FETCHER ---
    function fetchSheetViaJSONP(sheetId, sheetName, gid = null) {
      return new Promise((resolve, reject) => {
        const callbackName = 'sheetCallback_' + crypto.randomUUID().replace(/-/g, '');
        const script = document.createElement('script');
        const cleanup = () => {
          clearTimeout(timeout);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        };
        const timeout = setTimeout(() => { cleanup(); reject(new Error('Sheet request timed out')); }, 12000);

        window[callbackName] = function(data) {
          try {
            cleanup();
            if (!data || !data.table) {
              reject(new Error('Invalid table format from Google Sheets'));
              return;
            }
            const headers = data.table.cols.map(c => (c.label || c.id || '').trim());
            const rows = data.table.rows.map(r => {
              const obj = {};
              headers.forEach((h, idx) => {
                const cell = r.c && r.c[idx];
                obj[h] = cell && cell.f && /(?:date|submitted on)/i.test(h) ? String(cell.f)
                  : cell && cell.v !== null && cell.v !== undefined ? String(cell.v) : (cell && cell.f ? String(cell.f) : '');
              });
              return obj;
            });
            resolve(rows);
          } catch (e) {
            reject(e);
          }
        };

        const selection = gid !== null ? `gid=${encodeURIComponent(gid)}` : `sheet=${encodeURIComponent(sheetName)}`;
        script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?${selection}&tqx=responseHandler:${callbackName}`;
        script.onerror = () => {
          cleanup();
          reject(new Error('JSONP network error'));
        };
        document.body.appendChild(script);
      });
    }

              const res = await fetch(nominatimUrl, { headers: { 'Accept-Language': 'en' } });
              const data = await res.json();
              if (data && data.length > 0) {
                const newCoords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                cache[locStr] = newCoords;
                localStorage.setItem('tttg_geo_cache', JSON.stringify(cache));
                currentList[i] = { ...item, coords: newCoords };
                updated = true;
                setJobs([...currentList]);
              }
            } catch (err) {
              console.warn('Geocoding address failed for:', locStr, err);
            }
          }
        }

        if (updated) {
          setJobs([...currentList]);
        }
      };

      // Expands multi-location rows and resolves initial coordinates
      const expandAndEnrichJobs = (rawRows) => {
        const enriched = [];

        rawRows.forEach((job, jobIdx) => {
          let rawLoc = (job['Location'] || '').trim();
          if (!rawLoc) {
            const match = (job['Job Description'] || '').match(/Location:\s*([^\r\n,]+(?:,\s*[^\r\n]+)?)/i);
            if (match && match[1]) rawLoc = match[1].trim();
          }
          if (!rawLoc) rawLoc = 'Location on request';

          const locations = splitLocationString(rawLoc);

          if (locations.length <= 1) {
            const singleLoc = locations[0] || rawLoc;
            const coordData = resolveCoordinates(singleLoc, job['Job Description']);
            enriched.push({
              ...job,
              id: job['Job ID'] || `job_${jobIdx}`,
              originalJobId: job['Job ID'],
              coords: coordData ? coordData.latLng : null,
              displayLocation: singleLoc,
              rawLocation: rawLoc,
              isMultiLocation: false,
              allLocations: [singleLoc]
            });
          } else {
            // Multi-site openings: Create separate branch entry for map & ranking
            locations.forEach((branchLoc, branchIdx) => {
              const coordData = resolveCoordinates(branchLoc, job['Job Description']);
              enriched.push({
                ...job,
                id: `${job['Job ID'] || `job_${jobIdx}`}_b${branchIdx + 1}`,
                originalJobId: job['Job ID'],
                coords: coordData ? coordData.latLng : null,
                displayLocation: branchLoc,
                rawLocation: rawLoc,
                isMultiLocation: true,
                locationIndex: branchIdx + 1,
                totalLocations: locations.length,
                allLocations: locations
              });
            });
          }
        });

        return enriched;
      };

      // Enrich and normalize candidates
      const enrichCandidates = (rawRows) => {
        return rawRows.map((cand, idx) => {
          const name = (cand['Candidate Name'] || cand['Candidates Candidate Name'] || cand['Name'] || cand.name || '').trim();
          const title = (cand['Current Title'] || cand['Current / Most Recent Title'] || cand['Title'] || cand.title || '').trim();
          const loc = (cand['Location'] || cand.location || '').trim();
          const company = (cand['Current Company'] || cand['Current / Most Recent Company'] || cand['Company'] || cand.company || '').trim();
          const industry = (cand['Industry'] || cand.industry || '').trim();
          const compTarget = (cand['Compensation Target'] || cand['Target Compensation / Current Rate'] || cand.compensationTarget || '').trim();
          const compCurrent = (cand['Current Compensation'] || cand.currentCompensation || '').trim();
          const notes = [cand['Notes'] || cand.notes, cand['Profile Summary'], cand['Additional Notes']].filter(Boolean).join(' | ').trim();
          const shift = (cand['Shift'] || cand.shift || '').trim();
          const submittedTo = (cand['Submitted To'] || cand['Client Submitted To'] || cand.submittedTo || '').trim();
          const submittedOn = (cand['Submitted On'] || cand['Submission Date'] || cand.submittedOn || '').trim();
          const links = getCandidateLinks(cand);
          const licenses = (cand['Licenses'] || cand['License & Certifications'] || cand['Certifications'] || cand.licenses || '').trim();

          const place = resolveCandidateLocation(loc);

          return {
            id: `cand_${idx}`,
            name,
            title,
            location: loc,
            company,
            industry,
            compensationTarget: compTarget,
            currentCompensation: compCurrent,
            notes,
            shift,
            submittedTo,
            submittedOn,
            ...links,
            licenses,
            coords: place.coords,
            approxLevel: place.approxLevel,
            cityKey: place.cityKey,
            needsGeocode: !!place.needsGeocode
          };
        }).filter(c => c.name);
      };

      // One-time background geocode for candidate cities missing from CITY_COORDINATES (city level only, cached locally).
      const geocodeCandidateCities = async (list) => {
        if (candidateGeocodeRunningRef.current) return;
        candidateGeocodeRunningRef.current = true;
        try { await geocodeCandidateCityKeys(list); } finally { candidateGeocodeRunningRef.current = false; }
      };
      const geocodeCandidateCityKeys = async (list) => {
        let cache = {};
        try { cache = JSON.parse(localStorage.getItem('tttg_geo_cache') || '{}'); } catch (e) {}
        const keys = [...new Set(list.filter(c => c.needsGeocode && c.cityKey && c.cityKey.split(' ').length <= 5).map(c => c.cityKey))]
          .filter(key => !(`cand:${key}` in cache));
        for (const key of keys) {
          try {
            await new Promise(r => setTimeout(r, 1100));
            const q = key.includes(',') ? key : `${key}, Ontario`;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ca,us&q=${encodeURIComponent(q)}`, { headers: { 'Accept-Language': 'en' } });
            const data = await res.json();
            const hit = data && data[0];
            const placeTypes = ['city','town','village','hamlet','suburb','municipality','neighbourhood','quarter','borough','city_district','locality'];
            const ok = hit && placeTypes.includes(hit.addresstype) && hit.display_name.toLowerCase().includes(key.split(/[ ,]/)[0]);
            // null marks a failed lookup so it is not retried every load
            cache[`cand:${key}`] = ok ? [parseFloat(hit.lat), parseFloat(hit.lon)] : null;
            localStorage.setItem('tttg_geo_cache', JSON.stringify(cache));
            if (ok) {
              setCandidates(prev => prev.map(c => c.cityKey === key && c.needsGeocode
                ? { ...c, coords: cache[`cand:${key}`], approxLevel: 'city', needsGeocode: false } : c));
            }
          } catch (err) {
            console.warn('Candidate city geocode failed for:', key, err);
          }
        }
      };

      // 1. Fetch Data (Jobs & Candidates Concurrently)
      const fetchJobs = async () => {
        setLoading(true);
        setError(null);
        setTrackerLinkWarning('');
        // Start the independent read now; source failures never prevent job/candidate loading.
        const trackerRequest = fetchSheetViaJSONP('1RexJFAEWRwNjzeGThutrA0zMObu2g4r3q0Vu0uiDbQs', null, TRACKER_SUBMISSIONS_GID)
          .then(rows => ({rows}), error => ({error}));
        const withTrackerLinks = async records => {
          const result = await trackerRequest;
          if (result.error) {
            setTrackerLinkWarning('Tracker submission links could not be loaded. Existing source links are shown where available.');
            return records;
          }
          try {
            // Validate source columns before using the Tracker as a candidate fallback.
            attachTrackerSubmissions([], result.rows);
            let pool = records;
            if (!pool.length && result.rows.length) {
              const unique = new Map();
              enrichCandidates(result.rows)
                .sort((a, b) => (Date.parse(b.submittedOn) || 0) - (Date.parse(a.submittedOn) || 0))
                .forEach(candidate => {
                  const key = [candidate.name, candidate.title, candidate.company].map(normalizeIdentity).join('|');
                  if (!unique.has(key)) unique.set(key, candidate);
                });
              pool = [...unique.values()];
            }
            return attachTrackerSubmissions(pool, result.rows);
          }
          catch {
            setTrackerLinkWarning('Tracker column mapping needs review. Existing source links are shown where available.');
            return records;
          }
        };
        try {
          let activeJobs = [];
          let loadedCandidates = [];

          // A. Fetch Jobs
          try {
            const rawRows = await fetchSheetViaJSONP('1RexJFAEWRwNjzeGThutrA0zMObu2g4r3q0Vu0uiDbQs', 'Jobs');
            activeJobs = rawRows.filter(j => (j['Status'] || '').toLowerCase() === 'active');
          } catch (jsonpErr) {
            console.warn('JSONP jobs fetch failed, trying standard CSV fetch:', jsonpErr);
            const res = await fetch(CSV_URL);
            if (!res.ok) throw new Error(`HTTP error ${res.status}`);
            const csvText = await res.text();
            const parsed = parseCSV(csvText);
            activeJobs = parsed.filter(j => (j['Status'] || '').toLowerCase() === 'active');

          // B. Fetch Candidates
          try {
            const rawCand = await fetchSheetViaJSONP('1RexJFAEWRwNjzeGThutrA0zMObu2g4r3q0Vu0uiDbQs', 'Candidates');
            loadedCandidates = enrichCandidates(rawCand);
          } catch (candJsonpErr) {
            console.warn('JSONP candidates fetch failed, trying standard CSV fetch:', candJsonpErr);
            try {
              const cRes = await fetch(CANDIDATES_CSV_URL);
              if (cRes.ok) {
                const cText = await cRes.text();
                const cParsed = parseCSV(cText);

              }
            } catch (cFetchErr) {
              console.warn('Candidates CSV fetch fallback:', cFetchErr);
            }

          if (activeJobs.length === 0) {
            throw new Error('No active jobs found.');
          }

          const enriched = expandAndEnrichJobs(activeJobs);
          setJobs(enriched);

          const finalCandidates = await withTrackerLinks(loadedCandidates);
          setCandidates(finalCandidates);

          setLastUpdated(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));

          // Trigger asynchronous background precision geocoder for exact addresses
          geocodeExactAddresses(enriched).then(() => geocodeCandidateCities(finalCandidates));
        } catch (err) {
          console.warn('Live data refresh failed:', err.message);
          setError('Live records could not be refreshed. Please retry.');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (isAuthenticated) {
          fetchJobs();
        }
      }, [isAuthenticated]);

      // 2. Initialize Leaflet Map with Refined Executive Styling
      useEffect(() => {
        if (!isAuthenticated || !mapContainerRef.current) return;

            mapInstanceRef.current = null;
            candidateClusterRef.current = null;
            markersRef.current = {};
            candidateCityMarkersRef.current = {};
            candidateMarkersRef.current = {};
            connectionLineRef.current = null;
            searchMarkerRef.current = null;
            userMarkerRef.current = null;
            radiusCircleRef.current = null;
            hasInitiallyFittedRef.current = false;
          };
        }
      }, [isAuthenticated]);

      // Ensure map always recalculates full screen tiles on data updates
      useEffect(() => {
        if (mapInstanceRef.current) {
          const timer = setTimeout(() => {
            mapInstanceRef.current.invalidateSize();
          }, 250);
          return () => clearTimeout(timer);
        }
      }, [jobs, searchCoords, activeTab, sidebarWidth, isSidebarCollapsed, isDesktop]);

      // Deterministic in-city scatter so candidates never stack on one city-center point.
      const spreadCandidates = useMemo(() => {
        const groups = new Map();
        candidates.forEach(cand => {
          if (!validCoords(cand.coords)) return;
          const key = cand.coords.join(',');
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(cand);
        });
        // Seed from identity, not row index, so a candidate keeps its spot when rows are added. Repeat rows get #2, #3.
        const seen = new Map();
        return candidates.map(cand => {
          if (!validCoords(cand.coords)) return { ...cand, spreadCoords: null, cityCandidates: [] };
          const identity = [cand.name, cand.title, cand.company, cand.location].map(normalizeIdentity).join('|');
          const count = (seen.get(identity) || 0) + 1;
          seen.set(identity, count);
          // province-only (no city hit) gets a wider, clearly-approximate scatter
          const maxKm = cand.approxLevel === 'province' ? 40 : 7;
          return { ...cand,
            spreadCoords: scatterWithinCity(cand.coords, count > 1 ? `${identity}#${count}` : identity, maxKm),
            cityCandidates: groups.get(cand.coords.join(','))
          };
        });
      }, [candidates]);

      // (Map pin effects live below matchedCandidates so their dependencies are defined first.)


      // 4. Geocode Location Search (Multi-stage fallback for partial & full addresses)
      const handleLocationSearch = async (e) => {
        if (e) e.preventDefault();
        const query = searchQuery.trim();
        setSearchError(null);
        setShowSuggestions(false);

        if (!query) {
          setSearchCoords(null);
          setSearchAddressName('');
          if (searchMarkerRef.current && mapInstanceRef.current) {
            mapInstanceRef.current.removeLayer(searchMarkerRef.current);
            searchMarkerRef.current = null;
          }
          if (radiusCircleRef.current && mapInstanceRef.current) {
            mapInstanceRef.current.removeLayer(radiusCircleRef.current);
            radiusCircleRef.current = null;
          }
          return;
        }

        if (isSearchingLocation) return;
        setIsSearchingLocation(true);
        const map = mapInstanceRef.current;

        try {
          const cleanQuery = query.toLowerCase().trim();
          let coords = null;
          let displayName = query;

          // 1. Check persistent geocache
          try {
            const cache = JSON.parse(localStorage.getItem('tttg_geo_cache') || '{}');
            if (cache[cleanQuery] || cache[query]) {
              coords = cache[cleanQuery] || cache[query];
              displayName = query;
            }
          } catch (e) {}

          // 2. Check built-in city coordinates
          if (!coords) {
            for (const [key, val] of Object.entries(CITY_COORDINATES)) {
              if (cleanQuery === key || cleanQuery === `${key}, on` || cleanQuery === `${key}, ontario` || cleanQuery === `${key}, ca`) {
                coords = val;
                displayName = key.toUpperCase();
                break;
              }
            }
          }

          // 3. Check partial city in query if not a specific street number
          if (!coords && !/\d+/.test(cleanQuery)) {
            for (const [key, val] of Object.entries(CITY_COORDINATES)) {
              if (cleanQuery.includes(key) || key.includes(cleanQuery)) {
                coords = val;
                displayName = key.toUpperCase();
                break;
              }
            }
          }

          // 4. Multi-stage Nominatim Search (handles full street address and partial queries)
          if (!coords) {
            const queriesToTry = [
              query,
              !/(on|ontario|ca|california|mi|michigan|ny|tx|fl|qc|bc|alberta)/i.test(query) ? `${query}, Ontario, Canada` : null,
              !/(canada|usa|us)/i.test(query) ? `${query}, Canada` : null
            ].filter(Boolean);

            for (const q of queriesToTry) {
              try {
                const nominatimUrl = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ca,us&q=${encodeURIComponent(q)}`;
                const res = await fetch(nominatimUrl, { headers: { 'Accept-Language': 'en' } });
                if (res.ok) {
                  const data = await res.json();
                  if (Array.isArray(data) && data.length > 0) {
                    coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                    displayName = data[0].display_name.split(',').slice(0, 3).join(',').trim();

                    // Save to persistent cache
                    try {
                      const cache = JSON.parse(localStorage.getItem('tttg_geo_cache') || '{}');
                      cache[cleanQuery] = coords;
                      cache[query] = coords;
                      localStorage.setItem('tttg_geo_cache', JSON.stringify(cache));
                    } catch (e) {}
                    break;
                  }
                }
              } catch (fetchErr) {
                console.warn('Nominatim lookup notice for', q, fetchErr);
              }
            }
          }

          if (coords) {
            setSearchCoords(coords);
            setSearchAddressName(displayName);
            setSearchError(null);

            if (map) {
              try {
                if (searchMarkerRef.current) map.removeLayer(searchMarkerRef.current);
                if (radiusCircleRef.current) map.removeLayer(radiusCircleRef.current);

                const searchIcon = L.divIcon({
                  html: `
                    <div class="relative flex items-center justify-center">
                      <div class="w-8 h-8 rounded-full bg-stone-900 border-2 border-white shadow-xl flex items-center justify-center text-white text-xs font-bold candidate-pulse">
                        📍
                      </div>
                    </div>
                  `,

                  iconSize: [32, 32],
                  iconAnchor: [16, 16]
                });

                searchMarkerRef.current = L.marker(coords, { icon: searchIcon, zIndexOffset: 1000 })
                  .bindTooltip(`<b>Candidate Location</b><br/>${displayName}`, { permanent: true, direction: 'bottom', offset: [0, 10], className: 'custom-tooltip' })
                  .addTo(map);

                if (maxRadius !== 'ALL') {

                  }).addTo(map);

                map.flyTo(coords, 10, { duration: 1 });
              } catch (mapErr) {
                console.warn('Map marker positioning notice:', mapErr);
              }
            }
          } else {
            setSearchError(`Could not locate "${query}". Please check the address or try adding the city (e.g. "${query}, Toronto" or "${query}, ON").`);
          }
        } catch (err) {
          console.warn('Search geocode notice:', err);
          setSearchError(`Could not resolve location. Please try adding city and province.`);
        } finally {
          setIsSearchingLocation(false);
        }
      };

      // 4b. Live Address Suggestions (Uber / Google Maps style autocomplete)
      useEffect(() => {
        const query = searchQuery.trim();
        if (query.length < 2 || !showSuggestions) {
          setSuggestions([]);
          return;
        }

        const timer = setTimeout(async () => {
          const cleanQuery = query.toLowerCase();
          const results = [];

          // 1. Instant local matching from known cities & regional hubs
          Object.keys(CITY_COORDINATES).forEach(key => {
            if (key.startsWith(cleanQuery) || key.includes(cleanQuery)) {
              results.push({
                id: `local_${key}`,
                mainText: key.toUpperCase(),
                secondaryText: 'Regional Hub',
                coords: CITY_COORDINATES[key],
                fullName: key.toUpperCase()
              });
            }
          });

          // 2. Query high-speed OSM Photon typeahead endpoint (biased towards ON / North America)
          try {
            const photonUrl = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5&lat=43.7&lon=-79.4`;
            const res = await fetch(photonUrl);
            if (res.ok) {
              const data = await res.json();
              if (data && Array.isArray(data.features)) {
                data.features.forEach(feat => {
                  const props = feat.properties || {};
                  const coords = [feat.geometry.coordinates[1], feat.geometry.coordinates[0]]; // lat, lon

                  let main = props.name || props.street || props.city || query;
                  if (props.housenumber && props.street) {

                  const secondary = subParts.join(', ');
                  const fullName = `${main}, ${secondary}`;

                    results.push({
                      id: `photon_${feat.properties.osm_id || Math.random()}`,
                      mainText: main,
                      secondaryText: secondary,
                      coords: coords,
                      fullName: fullName
                    });

        }, 180);

        return () => clearTimeout(timer);
      }, [searchQuery, showSuggestions]);

      // Handle selecting a suggested address from dropdown
      const handleSelectSuggestion = (item) => {

        setSearchQuery(fullDisplay);
        setSearchCoords(item.coords);
        setSearchAddressName(item.mainText);
        setSuggestions([]);
        setShowSuggestions(false);

          cache[fullDisplay.toLowerCase()] = item.coords;
          cache[item.mainText.toLowerCase()] = item.coords;
          localStorage.setItem('tttg_geo_cache', JSON.stringify(cache));

        const map = mapInstanceRef.current;

          try {

            if (radiusCircleRef.current) map.removeLayer(radiusCircleRef.current);

            const searchIcon = L.divIcon({

                <div class="relative flex items-center justify-center">

              .bindTooltip(`<b>Candidate Location</b><br/>${item.mainText}`, { permanent: true, direction: 'bottom', offset: [0, 10], className: 'custom-tooltip' })
              .addTo(map);

            map.flyTo(item.coords, 10, { duration: 1 });
          } catch (err) {

      };

      // Close autocomplete dropdown on click outside
      useEffect(() => {

      }, []);

      // 5. Unique Owners

      }, [jobs]);

      // 6. Filter & Sort Jobs
      const processedJobs = useMemo(() => {

          .map(job => {

              );

          .filter(job => {

              const matchCompany = (job['Company'] || '').toLowerCase().includes(kw);
              const matchLoc = (job['displayLocation'] || '').toLowerCase().includes(kw);
              const matchDesc = (job['Job Description'] || '').toLowerCase().includes(kw);
              if (!matchTitle && !matchCompany && !matchLoc && !matchDesc) return false;
            }

            if (selectedOwner !== 'ALL') {
              const owners = (job['Owners'] || '').split(',').map(o => o.trim());
              if (!owners.includes(selectedOwner)) return false;
            }

            if (searchCoords && maxRadius !== 'ALL' && job.distance !== null) {
              if (job.distance > parseInt(maxRadius)) return false;
            }

            if (regionFilter === 'ONTARIO') {
              const [lat, lng] = job.coords || [0, 0];
              const isOntCoords = lat >= 41.5 && lat <= 46.5 && lng >= -84.0 && lng <= -74.0;
              const isOntText = /\b(on|ontario|toronto|windsor|mississauga|brampton|hamilton|london|kitchener|waterloo|markham|vaughan|ottawa|cambridge|guelph|barrie|oakville|burlington|oshawa|st\. catharines|peterborough|belleville|stratford|chatham|sarnia|newmarket|ajax|pickering|whitby)\b/i.test(job.displayLocation || job.rawLocation || '');
              if (!isOntCoords && !isOntText) return false;
            } else if (regionFilter === 'CANADA') {
              const [lat, lng] = job.coords || [0, 0];
              const isOntCoords = lat >= 41.5 && lat <= 46.5 && lng >= -84.0 && lng <= -74.0;
              const isCanCoords = isOntCoords || (lat >= 41.0 && lat <= 70.0 && lng >= -141.0 && lng <= -52.0);
              const isCanText = /\b(on|ontario|bc|british columbia|ab|alberta|qc|quebec|mb|manitoba|sk|saskatchewan|ns|nova scotia|nb|new brunswick|nl|newfoundland|pe|prince edward island|canada)\b/i.test(job.displayLocation || job.rawLocation || '') || /canada/i.test(job['Job Description'] || '');
              if (!isCanCoords && !isCanText) return false;
            } else if (regionFilter === 'GLOBAL') {
              const [lat, lng] = job.coords || [0, 0];
              const isOntCoords = lat >= 41.5 && lat <= 46.5 && lng >= -84.0 && lng <= -74.0;
              const isCanCoords = isOntCoords || (lat >= 41.0 && lat <= 70.0 && lng >= -141.0 && lng <= -52.0);
              const isCanText = /\b(on|ontario|bc|ab|qc|mb|sk|ns|nb|nl|pe|canada)\b/i.test(job.displayLocation || job.rawLocation || '') || /canada/i.test(job['Job Description'] || '');
              if (isCanCoords || isCanText) return false;
            }

            return true;
          })
          .sort((a, b) => {
            if (searchCoords) {
              if (a.distance === null) return 1;
              if (b.distance === null) return -1;
              return a.distance - b.distance;
            }
            return 0;
          });
      }, [jobs, searchCoords, keywordFilter, selectedOwner, maxRadius, unit, regionFilter]);

      const handleSelectJob = (job) => {
        setSelectedJob(job);
        setPinnedCandidateId(null);
        setDrawerTab('role');
        setCandidateMatchScope('relevant');
        setCandidateSearchText('');
        setRadiusKm(50);
        if (connectionLineRef.current && mapInstanceRef.current) {
          mapInstanceRef.current.removeLayer(connectionLineRef.current);
          connectionLineRef.current = null;
        }
        if (mapInstanceRef.current) {
          Object.values(candidateMarkersRef.current).forEach(m => mapInstanceRef.current.removeLayer(m));
          candidateMarkersRef.current = {};
        }

        if (job.coords && mapInstanceRef.current) {
          const currentZoom = mapInstanceRef.current.getZoom();
          // Keep view wide enough (max zoom 9 instead of 11) so nearby pins don't disappear off-screen
          const targetZoom = Math.min(Math.max(currentZoom, 8.5), 9.5);
          // A hidden map (mobile List tab) has zero size and cannot animate a fly.
          if (mapInstanceRef.current.getSize().x > 0) mapInstanceRef.current.flyTo(job.coords, targetZoom, { duration: 0.8 });
          else mapInstanceRef.current.setView(job.coords, targetZoom, { animate: false });
          const marker = markersRef.current[job.id];
          if (marker) {
            marker.openTooltip();
          }
        }
      };

      // Rank title match first, then industry, then city-level distance. Unknown locations remain eligible.
      const matchedCandidates = useMemo(() => {
        if (!selectedJob) return [];
        return spreadCandidates
          .map(cand => {
            const relevance = getCandidateRelevance(selectedJob, cand);
            if (!relevance) return null;
            let distanceKm = null;
            if (validCoords(selectedJob.coords) && validCoords(cand.coords) && cand.approxLevel !== 'province') {
              distanceKm = calculateDistance(
                selectedJob.coords[0], selectedJob.coords[1],
                cand.coords[0], cand.coords[1], 'km'   // use city center, not the scattered point
              );
            }
            return { ...cand, ...relevance, distanceKm };
          })
          .filter(cand => {
            if (!cand) return false;
            if (candidateMatchScope === 'role' && cand.matchTier !== 0) return false;
            if (candidateMatchScope === 'similar' && cand.matchTier !== 1) return false;
            if (candidateMatchScope === 'industry' && cand.matchTier !== 2) return false;
            const query = candidateSearchText.toLowerCase().trim();
            const text = `${cand.name} ${cand.title} ${cand.location} ${cand.company} ${cand.notes} ${cand.industry}`.toLowerCase();
            return !query || text.includes(query);
          })
          .filter(cand => {
            // radius dial: keep in-radius always; keep out-of-radius (or unknown location) only if strong title match
            if (radiusKm === 'ALL') return true;
            if (cand.distanceKm !== null && cand.distanceKm <= radiusKm) return true;
            return cand.matchTier === 0;   // strong title match survives the wall
          })
          .sort((a, b) =>
            a.matchTier - b.matchTier ||
            ((a.distanceKm ?? 1e9) - (b.distanceKm ?? 1e9)) ||
            a.name.localeCompare(b.name)
          );
      }, [selectedJob, spreadCandidates, candidateMatchScope, candidateSearchText, radiusKm]);

      // Candidates show only once a job is picked or a location is searched, unless the user turned them off.
      useEffect(() => {
        if (selectedJob || searchCoords) {
          if (!candidatesLayerTouchedRef.current) setShowCandidatesLayer(true);
        } else {
          setShowCandidatesLayer(false);
          candidatesLayerTouchedRef.current = false;
        }
      }, [selectedJob, searchCoords]);
      const candidatesInPlay = !!(selectedJob || searchCoords);
      const candidatesOnMap = candidatesInPlay && showCandidatesLayer;
      // With a job picked, the map shows that job's matches; with only a search, everyone near the search.
      const mapCandidatePool = useMemo(() => {
        if (selectedJob) return matchedCandidates;
        if (!searchCoords) return [];
        const dist = c => validCoords(c.spreadCoords) ? calculateDistance(searchCoords[0], searchCoords[1], c.spreadCoords[0], c.spreadCoords[1]) : 1e9;
        return [...spreadCandidates].sort((a, b) => dist(a) - dist(b));
      }, [selectedJob, matchedCandidates, searchCoords, spreadCandidates]);

      // 3a. Job pins (independent, always visible)
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;

        Object.values(markersRef.current).forEach(m => map.removeLayer(m));
        markersRef.current = {};

        if (showJobsLayer) {
          processedJobs.forEach(job => {
            if (!validCoords(job.coords)) return;
            const [lat, lng] = job.coords;
            const isSelected = selectedJob && selectedJob.id === job.id;

            const customIcon = L.divIcon({
              html: `<div class="job-money-marker ${isSelected ? 'is-selected' : ''}">💰</div>`,
              className: 'custom-job-pin', iconSize: [44, 44], iconAnchor: [22, 56], popupAnchor: [0, -56]
            });
            const marker = L.marker([lat, lng], { icon: customIcon, zIndexOffset: 2000, title: job['Job Title'] });

            marker.bindTooltip(`
              <div class="px-1.5 py-1">
                <p class="font-semibold text-stone-900 text-xs">${escapeHtml(job['Job Title'])}</p>
                <p class="text-stone-500 text-[10px]">${escapeHtml(job['Company'])}</p>
                <p class="text-stone-700 text-[10px] mt-0.5 font-medium">📌 ${escapeHtml(job.displayLocation)}${job.isMultiLocation ? ` (Site ${job.locationIndex}/${job.totalLocations})` : ''}</p>
              </div>
            `, { direction: 'top', offset: [0, -18], opacity: 0.98, className: 'leaflet-popup-content-wrapper p-2' });

            marker.on('click', () => {
              setSelectedCandidateGroup(null);
              handleSelectJob(job);
            });

            marker.addTo(map);
            markersRef.current[job.id] = marker;
          });
        }

        // Focus Toronto, ON comfortably once on initial load (avoids clumping)
        if (!hasInitiallyFittedRef.current && !searchCoords && !selectedJob && !selectedCandidateGroup) {
          map.setView([43.6625, -79.3900], 13);
          hasInitiallyFittedRef.current = true;
        }
        map.invalidateSize();
      }, [processedJobs, selectedJob, showJobsLayer, isAuthenticated]);

      // 3b. Candidate pins: only those inside the current view, scattered inside their city, capped for safety.
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;

        Object.values(candidateCityMarkersRef.current).forEach(marker => map.removeLayer(marker));
        candidateCityMarkersRef.current = {};
        if (candidateClusterRef.current) {
          map.removeLayer(candidateClusterRef.current);
          candidateClusterRef.current.clearLayers();
          candidateClusterRef.current = null;
        }
        if (!candidatesOnMap) return;

        const cluster = L.markerClusterGroup({
          maxClusterRadius: 45,
          showCoverageOnHover: false,
          spiderfyOnMaxZoom: false,        // was true, this was the swirl
          zoomToBoundsOnClick: true,
          disableClusteringAtZoom: 14,     // street-level zoom shows every scattered pin
          animate: false,                  // no spin
          iconCreateFunction: group => L.divIcon({
            html: `<span>${group.getChildCount()}</span>`, className: 'candidate-cluster',
            iconSize: [42, 42], iconAnchor: [21, 21]
          })
        });
        candidateClusterRef.current = cluster;

        const bounds = map.getBounds();
        const MAX_PINS = 300;
        let plotted = 0;
        mapCandidatePool.forEach(cand => {
          const plotCoords = cand.spreadCoords || cand.coords;
          if (!validCoords(plotCoords)) return;
          if (!bounds.contains(plotCoords)) return;     // only what is visible
          if (plotted >= MAX_PINS) return;
          plotted++;

          const isPinned = pinnedCandidateId === cand.id;
          const marker = L.marker(plotCoords, { icon: createCandidateIcon(isPinned), title: cand.name });

          marker.bindTooltip(`
            <div class="px-2 py-1 text-center">
              <p class="font-bold text-stone-900 text-xs">${escapeHtml(cand.name)}</p>
              <p class="text-stone-600 text-[10px] font-medium">${escapeHtml(cand.title)}</p>
              <p class="text-stone-500 text-[9px] mt-0.5">📌 ${escapeHtml(cand.location)} (approx.)</p>
              ${cand.company ? `<p class="text-stone-400 text-[9px]">🏢 ${escapeHtml(cand.company)}</p>` : ''}
              <p class="text-stone-400 text-[9px] mt-1">Click to view candidate details</p>
            </div>
          `, { direction: 'top', offset: [0, -18], opacity: 0.98, className: 'leaflet-popup-content-wrapper p-2' });

          marker.on('click', () => {
            setPinnedCandidateId(cand.id);
            if (selectedJob) {
              // Keep the job pinned; jump to this candidate in the matches panel.
              setActiveTab(prev => prev === 'map' && !isDesktop ? 'matches' : prev);
              setTimeout(() => {
                const el = document.querySelector(`[data-candidate-id="${cand.id}"]`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              }, 50);
              return;
            }
            setSelectedCandidateGroup({
              key: cand.location,
              cityName: cand.location,
              coords: cand.coords,
              candidates: cand.cityCandidates || [cand],
              selectedCandidateId: cand.id
            });
          });

          if (isPinned) marker.addTo(map);
          else cluster.addLayer(marker);
          candidateCityMarkersRef.current[cand.id] = marker;
        });
        cluster.addTo(map);
      }, [mapCandidatePool, candidatesOnMap, pinnedCandidateId, mapBounds, selectedJob, isDesktop, isAuthenticated]);

      // Radius dial outline around the picked job
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;
        if (radiusCircleJobRef.current) {
          map.removeLayer(radiusCircleJobRef.current);
          radiusCircleJobRef.current = null;
        }
        if (selectedJob && validCoords(selectedJob.coords) && radiusKm !== 'ALL') {
          radiusCircleJobRef.current = L.circle(selectedJob.coords, {
            radius: radiusKm * 1000, color: '#2B2723', fillColor: '#787165', fillOpacity: 0.05,
            weight: 1.25, dashArray: '4, 6', interactive: false
          }).addTo(map);
        }
      }, [selectedJob, radiusKm, isAuthenticated]);

      // Candidates inside the selected candidate city cluster, filtered by city text search
      const filteredCityCandidates = useMemo(() => {
        if (!selectedCandidateGroup) return [];
        let list = selectedCandidateGroup.candidates || [];
        if (candidateCityFilterText.trim()) {
          const q = candidateCityFilterText.toLowerCase().trim();
          list = list.filter(c => {
            const str = `${c.name} ${c.title} ${c.company} ${c.notes} ${c.industry} ${c.compensationTarget}`.toLowerCase();
            return str.includes(q);
          });
        }
        if (selectedCandidateGroup.selectedCandidateId) {
          list = [...list].sort((a, b) => {
            if (a.id === selectedCandidateGroup.selectedCandidateId) return -1;
            if (b.id === selectedCandidateGroup.selectedCandidateId) return 1;
            return 0;
          });
        }
        return list;
      }, [selectedCandidateGroup, candidateCityFilterText]);

      // Show the approximate reported candidate location without a proximity claim
      const handlePinCandidateOnMap = (cand) => {
        const map = mapInstanceRef.current;
        const targetCoords = cand.spreadCoords || cand.coords;
        if (!map || !validCoords(targetCoords)) return;

        setPinnedCandidateId(cand.id);

        // Remove previous polyline and candidate markers
        if (connectionLineRef.current) {
          map.removeLayer(connectionLineRef.current);
          connectionLineRef.current = null;
        }
        Object.values(candidateMarkersRef.current).forEach(m => map.removeLayer(m));
        candidateMarkersRef.current = {};

        const candIcon = createCandidateIcon(true);
        const candMarker = L.marker(targetCoords, { icon: candIcon, zIndexOffset: 1000, title: cand.name });
        candMarker.bindTooltip(`
          <div class="px-1.5 py-1">
            <p class="font-bold text-stone-900 text-xs">${escapeHtml(cand.name)}</p>
            <p class="text-stone-600 text-[11px] font-medium">${escapeHtml(cand.title)}</p>
            <p class="text-stone-500 text-[10px] mt-0.5">📌 ${escapeHtml(cand.location)}</p>
            ${cand.company ? `<p class="text-stone-400 text-[9px]">${escapeHtml(cand.company)}</p>` : ''}
          </div>
        `, { direction: 'top', offset: [0, -18], opacity: 0.98, className: 'leaflet-popup-content-wrapper p-2' });

        candMarker.addTo(map);
        candidateMarkersRef.current[cand.id] = candMarker;

        if (!isDesktop) setActiveTab('map');
        map.setView(targetCoords, Math.max(map.getZoom(), 12));
      };

      // Copy candidate pitch summary
      const copyCandidatePitch = async (cand) => {
        const lines = [
          `Candidate: ${cand.name}`,
          `Role: ${cand.title}`,
          `Location: ${cand.location}`,
          cand.company ? `Current Company: ${cand.company}` : '',
          cand.compensationTarget ? `Compensation Target: ${cand.compensationTarget}` : '',
          cand.industry ? `Industry: ${cand.industry}` : '',
          cand.notes ? `Notes / Focus: ${cand.notes}` : '',
          ...(cand.submissionEmails?.length ? cand.submissionEmails.map(email => `Submission email${email.client ? ` (${email.client})` : ''}: ${email.url}`) : cand.submissionLink ? [`Submission email: ${cand.submissionLink}`] : []),
          cand.profileLink ? `Profile: ${cand.profileLink}` : ''
        ].filter(Boolean);

        const pitch = lines.join('\n');
        await navigator.clipboard.writeText(pitch);
        setCopiedId(cand.id);
        setTimeout(() => setCopiedId(null), 2500);
      };

      // Geolocation handler for "My Location" (with Toronto, ON fallback)
      const handleFocusMyLocation = () => {
        if (!navigator.geolocation) {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.setView([43.6532, -79.3832], 9.5, { animate: true });
          }
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const coords = [pos.coords.latitude, pos.coords.longitude];
            setUserLocation(coords);
            if (mapInstanceRef.current) {
              mapInstanceRef.current.setView(coords, 10, { animate: true });
              if (userMarkerRef.current) {
                mapInstanceRef.current.removeLayer(userMarkerRef.current);
              }
              const userIcon = L.divIcon({
                html: `
                  <div class="relative flex items-center justify-center">
                    <div class="w-4 h-4 rounded-full bg-blue-600 border-2 border-white shadow-lg candidate-pulse"></div>
                  </div>
                `,
                className: 'user-location-pin',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
              });
              userMarkerRef.current = L.marker(coords, { icon: userIcon })
                .bindTooltip('📍 Your Current Location', { direction: 'top', offset: [0, -10] })
                .addTo(mapInstanceRef.current);
            }
          },
          (err) => {
            console.warn('Geolocation lookup notice, centering on Toronto, ON:', err);
            if (mapInstanceRef.current) {
              mapInstanceRef.current.setView([43.6532, -79.3832], 9.5, { animate: true });
            }
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      };

      // Clear candidate pins and connection line when selectedJob is closed
      useEffect(() => {
        if (!selectedJob && mapInstanceRef.current) {
          if (connectionLineRef.current) {
            mapInstanceRef.current.removeLayer(connectionLineRef.current);
            connectionLineRef.current = null;
          }
          Object.values(candidateMarkersRef.current).forEach(m => mapInstanceRef.current.removeLayer(m));
          candidateMarkersRef.current = {};
          setPinnedCandidateId(null);
          setDrawerTab('role');
          setActiveTab(prev => prev === 'matches' ? 'list' : prev);
        }
      }, [selectedJob]);

      const copyJobPitch = async (job) => {
        const otherSites = job.isMultiLocation && job.allLocations
          ? ` (Site ${job.locationIndex} of ${job.totalLocations} - Other sites: ${job.allLocations.filter(l => l !== job.displayLocation).join(', ')})`
          : '';
        const text = `📌 Role: ${job['Job Title']}\n🏢 Company: ${job['Company']}\n📍 Location: ${job['displayLocation']}${otherSites}\n💰 Comp: ${job['Compensation'] || 'Competitive'}\n👤 Recruiter: ${job['Owners']}\n\nOverview:\n${job['Job Description']?.slice(0, 350)}...`;
        await navigator.clipboard.writeText(text);
        setCopiedId(job.id);
        setTimeout(() => setCopiedId(null), 2500);
      };

      // Candidate distance is a city-level estimate, never exact.
      const candidateDistanceLabel = cand => cand.approxLevel === 'province' ? 'Province-level location'
        : cand.distanceKm === null || cand.distanceKm === undefined ? ''
        : cand.distanceKm < 5 ? 'Under 5 km (approx, city level)' : `About ${Math.round(cand.distanceKm)} km (approx, city level)`;

      const renderJobCard = (job) => {
        const isSelected = selectedJob && selectedJob.id === job.id;
        return (
          <div
            id={`job-card-${job.id}`}
            key={job.id}
            onClick={() => handleSelectJob(job)}
            className={`p-4 rounded-xl border transition-colors cursor-pointer relative bg-white ${
              isSelected ? 'border-stone-900 ring-1 ring-stone-900' : 'border-stone-200 hover:border-stone-400'
            }`}
          >
            {/* Top row: Title + Salary / Rate */}
            <div className="flex items-start justify-between gap-3">
              <div className="flex-1 min-w-0">
                <h3 className="font-bold text-stone-900 text-sm leading-snug">{job['Job Title']}</h3>
                <p className="text-xs text-stone-700 mt-0.5">{job['Company']}</p>
              </div>
              <span className="text-[11px] font-semibold text-stone-900 whitespace-nowrap shrink-0 pt-0.5">
                {job['Compensation'] || 'Competitive'}
              </span>
            </div>

            {/* Location & Proximity Distance */}
            <div className="mt-2.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-stone-700">
              <span>{job.displayLocation}</span>
              {job.isMultiLocation && <span className="text-stone-500">Site {job.locationIndex} of {job.totalLocations}</span>}
              {job.distance !== null && job.distance !== undefined && <span className="font-semibold text-stone-900">{job.distance} {unit} away</span>}
            </div>

            {/* Recruiter & Quick Action */}
            <div className="mt-3 pt-2.5 border-t border-stone-100 flex items-center justify-between text-xs">
              <span className="text-stone-500 text-[11px]">
                Owner: <span className="text-stone-900 font-medium">{job['Owners'] || 'N/A'}</span>
              </span>
              <div className="flex items-center gap-1 text-stone-600">
                <CopyButton onCopy={() => copyJobPitch(job)} copied={copiedId === job.id} label="Copy job pitch" />
                {isSelected && <span className="text-[11px] font-semibold text-stone-900 pl-1">Pinned</span>}
              </div>
            </div>
          </div>
        );
      };

      const renderCandidateCard = (cand) => {
        const isPinned = pinnedCandidateId === cand.id;
        const distanceLabel = candidateDistanceLabel(cand);
        return (
          <div
            key={cand.id}
            data-candidate-id={cand.id}
            className={`p-3.5 rounded-xl border bg-white transition-colors ${
              isPinned ? 'border-stone-900 ring-1 ring-stone-900' : 'border-stone-200 hover:border-stone-400'
            }`}
          >
            {/* Name, title, match type */}
            <div className="flex items-start justify-between gap-2">
              <div className="flex-1 min-w-0">
                <h5 className="font-bold text-[13px] text-stone-900">{cand.name}</h5>
                <p className="text-xs text-stone-900 mt-0.5">{cand.title}</p>
                {cand.company && <p className="text-[11px] text-stone-600 mt-0.5">{cand.company}</p>}
              </div>
              <span title={cand.matchReason} className="text-[10px] border border-stone-300 text-stone-900 px-1.5 py-0.5 rounded font-semibold shrink-0">
                {cand.matchLabel}
              </span>
            </div>

            <p className="mt-2 text-[11px] text-stone-700">{cand.matchReason}</p>

            <div className="mt-2 space-y-1 text-[11px] text-stone-700">
              <p>
                <span className="font-medium text-stone-900">{cand.location || 'Location not provided'}</span>
                {distanceLabel && <span className="text-stone-600">{`, ${distanceLabel}`}</span>}
              </p>
              {cand.compensationTarget && <p>Comp: <span className="text-stone-900">{cand.compensationTarget}</span></p>}
              {cand.industry && <p>Industry: <span className="text-stone-900">{cand.industry}</span></p>}
              {cand.shift && <p>Shift: <span className="text-stone-900">{cand.shift}</span></p>}
              {cand.notes && (
                <p className="p-2 rounded-lg text-[10.5px] mt-1.5 leading-relaxed bg-stone-50 border border-stone-200/70 text-stone-700">
                  <b className="text-stone-900">Notes:</b> {cand.notes}
                </p>
              )}
            </div>

            <CandidateSubmissionLink candidate={cand} />
            {/* Actions Row */}
            <div className="mt-2.5 pt-2 border-t border-stone-100 flex items-center justify-between text-xs">
              <button
                onClick={() => handlePinCandidateOnMap(cand)}
                disabled={!validCoords(cand.coords)}
                title={validCoords(cand.coords) ? 'Show approximate reported location' : 'No reported location available'}
                className={`px-2.5 py-1 rounded-md font-medium text-[11px] transition-colors border disabled:opacity-40 disabled:cursor-not-allowed ${
                  isPinned ? 'bg-stone-900 text-white border-stone-900' : 'bg-white hover:bg-stone-100 text-stone-900 border-stone-300'
                }`}
              >
                {isPinned ? 'Shown on map' : 'Show on map'}
              </button>
