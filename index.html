    // --- HAVERSINE DISTANCE FORMULA ---
    function calculateDistance(lat1, lon1, lat2, lon2, unit = 'km') {
      const R = unit === 'mi' ? 3958.8 : 6371; // Earth radius in mi or km
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) *
        Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c * 10) / 10;
    }

    // --- ROBUST CSV PARSER ---
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(cell);
          cell = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(cell);
          if (row.length > 0 && row.some(c => c.trim() !== '')) {
            lines.push(row);
          }
          row = [];
          cell = '';
        } else {
          cell += char;
        }
      }
      if (cell !== '' || row.length > 0) {
        row.push(cell);
        lines.push(row);
      }

      if (lines.length < 2) return [];
      const headers = lines[0].map(h => h.trim().replace(/^"|"$/g, ''));
      return lines.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = (r[idx] || '').trim();
        });
        return obj;
      });
    }

    // Normalizes location text and tries coordinate lookup
    function resolveCoordinates(locationStr, jobDescription = '') {
      if (!locationStr || locationStr.trim() === '') {
        // Fallback: search in description
        const match = jobDescription.match(/Location:\s*([^\r\n,]+(?:,\s*[^\r\n]+)?)/i);
        if (match && match[1]) {
          locationStr = match[1].trim();
        }
      }

      if (!locationStr) return null;

      const cleaned = locationStr.toLowerCase().replace(/[^\w\s,]/g, '').trim();
      
      // Direct dictionary check
      if (CITY_COORDINATES[cleaned]) {
        return { latLng: CITY_COORDINATES[cleaned], resolvedName: locationStr };
      }

      // Check partial matches
      for (const [key, coords] of Object.entries(CITY_COORDINATES)) {
        if (cleaned.includes(key) || key.includes(cleaned)) {
          return { latLng: coords, resolvedName: locationStr };
        }
      }

      return null;
    }

    // --- JSONP GOOGLE SHEETS FETCHER (Zero CORS restrictions) ---
    function fetchSheetViaJSONP(sheetId, sheetName) {
      return new Promise((resolve, reject) => {
        const callbackName = 'sheetCallback_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        
        window[callbackName] = function(data) {
          try {
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
            if (!data || !data.table) {
              reject(new Error('Invalid table format from Google Sheets'));
              return;
            }
            const headers = data.table.cols.map(c => (c.label || c.id || '').trim());
            const rows = data.table.rows.map(r => {
              const obj = {};
              headers.forEach((h, idx) => {
                const cell = r.c && r.c[idx];
                obj[h] = cell && cell.v !== null && cell.v !== undefined ? String(cell.v) : (cell && cell.f ? String(cell.f) : '');
              });
              return obj;
            });
            resolve(rows);
          } catch (e) {
            reject(e);
          }
        };

        script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${callbackName}`;
        script.onerror = () => {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error('JSONP network error'));
        };
        document.body.appendChild(script);
      });
    }

        setLoading(true);
        setError(null);
        try {
          let activeJobs = [];
          
          // Try JSONP loader first (bypasses CORS restrictions on file:// and web)
          try {
            const rawRows = await fetchSheetViaJSONP('1RexJFAEWRwNjzeGThutrA0zMObu2g4r3q0Vu0uiDbQs', 'Jobs');
            activeJobs = rawRows.filter(j => (j['Status'] || '').toLowerCase() === 'active');

            console.warn('JSONP fetch failed, trying standard fetch:', jsonpErr);

            if (!res.ok) throw new Error(`HTTP error ${res.status}`);
            const csvText = await res.text();
            const parsed = parseCSV(csvText);
            activeJobs = parsed.filter(j => (j['Status'] || '').toLowerCase() === 'active');
          }
          
          if (activeJobs.length === 0) {

            const coordData = resolveCoordinates(job['Location'], job['Job Description']);

              id: job['Job ID'],
              coords: coordData ? coordData.latLng : null,
              displayLocation: job['Location']

          });
          setJobs(enrichedMock);
          setError('Loaded cached records. Check connection or sheet permissions.');
          setLastUpdated(new Date().toLocaleTimeString());
        } finally {
          setLoading(false);
        }

      // 3. Update Markers when jobs or selection change

        const ontarioBounds = bounds.filter(([lat, lng]) => lat >= 41.5 && lat <= 46.5 && lng >= -84.0 && lng <= -74.0);

          map.setView([43.9, -79.8], 7);

      }, [jobs, selectedJob, searchCoords]);

      // 4. Geocode Location Search Query (Nominatim Fallback + Dictionary)
      const handleLocationSearch = async (e) => {
        if (e) e.preventDefault();
        if (!searchQuery.trim()) {
          setSearchCoords(null);
          setSearchAddressName('');
          if (searchMarkerRef.current && mapInstanceRef.current) {

          }
          if (radiusCircleRef.current && mapInstanceRef.current) {
            mapInstanceRef.current.removeLayer(radiusCircleRef.current);
            radiusCircleRef.current = null;
          }
          return;
        }

        setIsSearchingLocation(true);
        const map = mapInstanceRef.current;

        try {
          const cleanQuery = searchQuery.toLowerCase().trim();
          let coords = null;
          let displayName = searchQuery;

          // Check built-in dictionary first
          for (const [key, val] of Object.entries(CITY_COORDINATES)) {
            if (cleanQuery === key || cleanQuery.includes(key) || key.includes(cleanQuery)) {
              coords = val;
              displayName = key.toUpperCase();
              break;
            }
          }

          // Fallback to OpenStreetMap Nominatim
          if (!coords) {
            const nominatimUrl = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(searchQuery)}`;
            const res = await fetch(nominatimUrl, { headers: { 'Accept-Language': 'en' } });
            const data = await res.json();
            if (data && data.length > 0) {
              coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
              displayName = data[0].display_name.split(',').slice(0, 2).join(',');
            }
          }

          if (coords) {
            setSearchCoords(coords);
            setSearchAddressName(displayName);

            // Update candidate search marker on map
            if (map) {
              if (searchMarkerRef.current) map.removeLayer(searchMarkerRef.current);
              if (radiusCircleRef.current) map.removeLayer(radiusCircleRef.current);

              const searchIcon = L.divIcon({
                html: `
                  <div class="relative flex items-center justify-center">
                    <div class="w-8 h-8 rounded-full bg-blue-600 border-2 border-white shadow-xl flex items-center justify-center text-white text-sm font-bold search-pulse">
                      📍
                    </div>
                  </div>
                `,
                className: 'search-user-marker',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
              });

              searchMarkerRef.current = L.marker(coords, { icon: searchIcon, zIndexOffset: 1000 })
                .bindTooltip(`<b>Candidate Location</b><br/>${displayName}`, { permanent: true, direction: 'bottom', offset: [0, 10] })
                .addTo(map);

              // Draw radius circle if selected
              if (maxRadius !== 'ALL') {

                  color: '#3b82f6',
                  fillColor: '#60a5fa',
                  fillOpacity: 0.12,
                  weight: 2,
                  dashArray: '5, 8'

              }

              map.flyTo(coords, 9, { duration: 1.2 });

      // 6. Filter & Calculate Distances + Sort
      const processedJobs = useMemo(() => {
        return jobs
          .map(job => {
            let distance = null;
            if (searchCoords && job.coords) {
              distance = calculateDistance(
                searchCoords[0],
                searchCoords[1],
                job.coords[0],
                job.coords[1],
                unit
              );
            }
            return { ...job, distance };
          })
          .filter(job => {
            // Keyword filter
            if (keywordFilter.trim()) {
              const kw = keywordFilter.toLowerCase();
              const matchTitle = (job['Job Title'] || '').toLowerCase().includes(kw);
              const matchCompany = (job['Company'] || '').toLowerCase().includes(kw);
              const matchLoc = (job['displayLocation'] || '').toLowerCase().includes(kw);
              const matchDesc = (job['Job Description'] || '').toLowerCase().includes(kw);
              if (!matchTitle && !matchCompany && !matchLoc && !matchDesc) return false;
            }

            // Owner filter
            if (selectedOwner !== 'ALL') {
              const owners = (job['Owners'] || '').split(',').map(o => o.trim());
              if (!owners.includes(selectedOwner)) return false;
            }

            // Radius filter
            if (searchCoords && maxRadius !== 'ALL' && job.distance !== null) {
              if (job.distance > parseInt(maxRadius)) return false;
            }

            return true;
          })
          .sort((a, b) => {
            if (searchCoords) {
              if (a.distance === null) return 1;
              if (b.distance === null) return -1;
              return a.distance - b.distance;
            }
            return 0; // maintain original order
          });
      }, [jobs, searchCoords, keywordFilter, selectedOwner, maxRadius, unit]);

      // Center map on job card click
      const handleSelectJob = (job) => {
        setSelectedJob(job);
        if (job.coords && mapInstanceRef.current) {
          mapInstanceRef.current.flyTo(job.coords, 11, { duration: 1 });
          const marker = markersRef.current[job.id];
          if (marker) {
            marker.openTooltip();
          }
        }
      };

      // Copy Job Pitch to Clipboard
      const copyJobPitch = (job) => {
        const text = `📌 Role: ${job['Job Title']}\n🏢 Company: ${job['Company']}\n📍 Location: ${job['displayLocation']}\n💰 Comp: ${job['Compensation'] || 'Competitive'}\n👤 Recruiter: ${job['Owners']}\n\nDescription:\n${job['Job Description']?.slice(0, 400)}...`;
        navigator.clipboard.writeText(text);
        setCopiedId(job.id);
        setTimeout(() => setCopiedId(null), 2500);
      };

      return (
        <div className="flex flex-col h-screen w-screen overflow-hidden bg-slate-950 font-sans">
          
          {/* HEADER / NAVIGATION */}
          <header className="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 flex items-center justify-between shrink-0 z-30">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-900/30">
                <span className="text-xl">🗺️</span>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-bold text-base text-white tracking-tight">Top Tier Talent</h1>
                  <span className="bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded-full font-medium border border-emerald-500/30">Active Jobs Map</span>
                </div>
                <p className="text-xs text-slate-400 hidden sm:block">Real-time candidate radius search & distance ranking</p>
              </div>
            </div>

            {/* Quick Status & Refresh */}
            <div className="flex items-center gap-3">
              <div className="hidden md:flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 text-xs text-slate-300">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span><b>{jobs.length}</b> Active Roles</span>
                {lastUpdated && <span className="text-slate-500">| Synced {lastUpdated}</span>}
              </div>

              <button
                onClick={fetchJobs}
                title="Sync live from Google Sheets"
                className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700 transition"
              >
                <span>🔄</span>
                <span className="hidden sm:inline">Refresh Sheet</span>
              </button>

              {/* Mobile View Toggle */}
              <div className="flex lg:hidden bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs">
                <button
                  onClick={() => setActiveTab('map')}
                  className={`px-3 py-1 rounded-md transition ${activeTab === 'map' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}
                >
                  Map
                </button>
                <button
                  onClick={() => setActiveTab('list')}
                  className={`px-3 py-1 rounded-md transition ${activeTab === 'list' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}
                >
                  List ({processedJobs.length})
                </button>
              </div>
            </div>
          </header>

          {/* SEARCH & FILTERS BAR */}
          <div className="border-b border-slate-800 bg-slate-900/60 p-3 shrink-0 z-20">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center gap-2 sm:gap-3">
              
              {/* Location Distance Search Form */}
              <form onSubmit={handleLocationSearch} className="flex-1 min-w-[280px] flex items-center relative">
                <div className="absolute left-3 text-slate-400 text-sm">📍</div>
                <input
                  type="text"
                  placeholder="Type candidate location (e.g. Detroit, Windsor, London ON)..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-9 pr-24 py-2 bg-slate-800 border border-slate-700 focus:border-emerald-500 rounded-lg text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-emerald-500 transition"
                />
                <div className="absolute right-1.5 flex items-center gap-1">
                  {searchCoords && (
                    <button
                      type="button"
                      onClick={() => {
                        setSearchQuery('');
                        setSearchCoords(null);
                        setSearchAddressName('');
                      }}
                      className="text-xs text-slate-400 hover:text-white px-1.5 py-1"
                    >
                      ✕
                    </button>
                  )}
                  <button
                    type="submit"
                    disabled={isSearchingLocation}
                    className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white px-3 py-1 rounded-md text-xs font-semibold shadow transition flex items-center gap-1"
                  >
                    {isSearchingLocation ? 'Finding...' : 'Rank Distance'}
                  </button>
                </div>
              </form>

              {/* Keyword Filter */}
              <div className="w-44 shrink-0 relative">
                <input
                  type="text"
                  placeholder="Filter title/skill..."
                  value={keywordFilter}
                  onChange={(e) => setKeywordFilter(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-800 border border-slate-700 focus:border-emerald-500 rounded-lg text-sm text-white placeholder-slate-400 focus:outline-none text-xs"
                />
                {keywordFilter && (
                  <button onClick={() => setKeywordFilter('')} className="absolute right-2.5 top-2 text-xs text-slate-400">✕</button>
                )}
              </div>

              {/* Owner Filter */}
              <select
                value={selectedOwner}
                onChange={(e) => setSelectedOwner(e.target.value)}
                className="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2.5 py-2 focus:outline-none focus:border-emerald-500"
              >
                <option value="ALL">All Owners</option>
                {uniqueOwners.map(o => (
                  <option key={o} value={o}>{o}</option>
                ))}
              </select>

              {/* Radius Filter */}
              {searchCoords && (
                <div className="flex items-center gap-1.5 bg-slate-800 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs">
                  <span className="text-slate-400">Max Radius:</span>
                  <select
                    value={maxRadius}
                    onChange={(e) => setMaxRadius(e.target.value)}
                    className="bg-transparent text-emerald-400 font-semibold focus:outline-none cursor-pointer"
                  >
                    <option value="ALL" className="bg-slate-800 text-white">Any distance</option>
                    <option value="25" className="bg-slate-800 text-white">Within 25 {unit}</option>
                    <option value="50" className="bg-slate-800 text-white">Within 50 {unit}</option>
                    <option value="100" className="bg-slate-800 text-white">Within 100 {unit}</option>
                    <option value="250" className="bg-slate-800 text-white">Within 250 {unit}</option>
                  </select>
                </div>
              )}

              {/* KM / Miles Unit Toggle */}
              <div className="flex bg-slate-800 border border-slate-700 rounded-lg p-0.5 text-xs">
                <button
                  onClick={() => setUnit('km')}
                  className={`px-2 py-1 rounded ${unit === 'km' ? 'bg-slate-700 text-white font-bold' : 'text-slate-400'}`}
                >
                  km
                </button>
                <button
                  onClick={() => setUnit('mi')}
                  className={`px-2 py-1 rounded ${unit === 'mi' ? 'bg-slate-700 text-white font-bold' : 'text-slate-400'}`}
                >
                  mi
                </button>
              </div>

            </div>

            {/* Candidate Search Active Pill */}
            {searchCoords && (
              <div className="max-w-7xl mx-auto mt-2 flex items-center justify-between bg-blue-950/40 border border-blue-800/60 px-3 py-1.5 rounded-lg text-xs text-blue-300">
                <div className="flex items-center gap-2">
                  <span>📍 Ranked by proximity to: <b>{searchAddressName}</b></span>
                  <span className="bg-blue-600/30 text-blue-300 px-2 py-0.5 rounded text-[10px] font-mono">
                    [{searchCoords[0].toFixed(2)}, {searchCoords[1].toFixed(2)}]
                  </span>
                </div>
                <button
                  onClick={() => {
                    setSearchQuery('');
                    setSearchCoords(null);
                    setSearchAddressName('');
                  }}
                  className="text-blue-400 hover:text-white underline text-xs"
                >
                  Clear search
                </button>
              </div>
            )}
          </div>

          {/* MAIN WORKSPACE SPLIT */}
          <div className="flex-1 flex overflow-hidden relative">

            {/* LEFT / SIDEBAR: RANKED JOB CARDS LIST */}
            <div className={`w-full lg:w-[460px] xl:w-[500px] border-r border-slate-800 bg-slate-900/40 flex flex-col shrink-0 overflow-hidden ${activeTab === 'map' ? 'hidden lg:flex' : 'flex'}`}>
              
              {/* List Header */}
              <div className="p-3 bg-slate-900/80 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400">
                <span>Showing <b>{processedJobs.length}</b> Active Roles {searchCoords ? '(Sorted by Distance)' : ''}</span>
                {searchCoords && <span className="text-emerald-400 font-medium">Nearest first ⬇️</span>}
              </div>

              {/* Scrollable Cards Container */}
              <div className="flex-1 overflow-y-auto p-3 space-y-3">
                {loading ? (
                  <div className="py-20 text-center text-slate-400 space-y-3">
                    <div className="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p className="text-sm">Fetching live jobs from Google Sheet...</p>
                  </div>
                ) : processedJobs.length === 0 ? (
                  <div className="py-20 text-center text-slate-400 space-y-2">
                    <p className="text-2xl">🔍</p>
                    <p className="text-sm font-medium text-slate-300">No active jobs match your filters</p>
                    <p className="text-xs text-slate-500">Try adjusting your radius or search term.</p>
                  </div>
                ) : (
                  processedJobs.map((job, index) => {
                    const isSelected = selectedJob && selectedJob.id === job.id;
                    return (
                      <div
                        id={`job-card-${job.id}`}
                        key={job.id}
                        onClick={() => handleSelectJob(job)}
                        className={`p-4 rounded-xl border transition-all cursor-pointer relative ${
                          isSelected
                            ? 'bg-slate-800/90 border-emerald-500 shadow-lg shadow-emerald-950/40 ring-1 ring-emerald-500'
                            : 'bg-slate-900/80 hover:bg-slate-800/60 border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        {/* Top row: Title + Distance / Index */}
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-mono text-slate-500">#{index + 1}</span>
                              <h3 className="font-semibold text-white text-sm hover:text-emerald-400 transition">
                                {job['Job Title']}
                              </h3>
                            </div>
                            <p className="text-xs text-emerald-400 font-medium mt-0.5">{job['Company']}</p>
                          </div>

                          {/* Distance Badge */}
                          {job.distance !== null ? (
                            <span className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs px-2.5 py-1 rounded-full font-bold whitespace-nowrap flex items-center gap-1 shrink-0">
                              <span>📍</span> {job.distance} {unit}
                            </span>
                          ) : (
                            <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">
                              {job.displayLocation}
                            </span>
                          )}
                        </div>

                        {/* Location & Compensation */}
                        <div className="mt-2.5 flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs text-slate-400">
                          <div className="flex items-center gap-1">
                            <span>📌</span>
                            <span>{job.displayLocation}</span>
                          </div>
                          {job['Compensation'] && (
                            <div className="flex items-center gap-1 text-slate-300 font-medium">
                              <span>💰</span>
                              <span>{job['Compensation']}</span>
                            </div>
                          )}
                        </div>

                        {/* Recruiter & Actions */}
                        <div className="mt-3 pt-2.5 border-t border-slate-800 flex items-center justify-between text-xs">
                          <span className="text-slate-500">
                            Owner: <span className="text-slate-400">{job['Owners'] || 'N/A'}</span>
                          </span>

                          <div className="flex items-center gap-2">
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                copyJobPitch(job);
                              }}
                              className="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700 transition"
                            >
                              {copiedId === job.id ? '✓ Copied!' : '📋 Copy Pitch'}
                            </button>

                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                setSelectedJob(job);
                              }}
                              className="text-[11px] text-emerald-400 hover:text-emerald-300 font-medium"
                            >
                              Details &rarr;
                            </button>
                          </div>
                        </div>

                      </div>
                    );
                  })
                )}
              </div>
            </div>

            {/* RIGHT: INTERACTIVE MAP CONTAINER */}
            <div className={`flex-1 relative h-full bg-slate-950 ${activeTab === 'list' ? 'hidden lg:block' : 'block'}`}>
              <div ref={mapContainerRef} className="w-full h-full z-10" />

              {/* Map Floating Overlay Controls */}
              <div className="absolute top-4 right-4 z-20 flex items-center gap-2">
                <button
                  onClick={() => {
                    if (mapInstanceRef.current && jobs.length > 0) {
                      const ontarioCoords = jobs
                        .filter(j => j.coords && j.coords[0] >= 41.5 && j.coords[0] <= 46.5 && j.coords[1] >= -84.0 && j.coords[1] <= -74.0)
                        .map(j => j.coords);
                      if (ontarioCoords.length > 0) {
                        mapInstanceRef.current.fitBounds(ontarioCoords, { padding: [50, 50], maxZoom: 8 });
                      } else {
                        mapInstanceRef.current.setView([43.9, -79.8], 7);
                      }
                    }
                  }}
                  className="bg-slate-900/90 hover:bg-slate-800 text-white text-xs px-3 py-2 rounded-lg border border-slate-700 shadow-xl backdrop-blur font-medium transition flex items-center gap-1.5"
                >
                  <span>🍁</span> Focus Ontario
                </button>
                <button
                  onClick={() => {
                    if (mapInstanceRef.current && jobs.length > 0) {
                      const validCoords = jobs.filter(j => j.coords).map(j => j.coords);
                      if (validCoords.length > 0) {
                        mapInstanceRef.current.fitBounds(validCoords, { padding: [50, 50] });
                      }
                    }
                  }}
                  className="bg-slate-900/90 hover:bg-slate-800 text-white text-xs px-3 py-2 rounded-lg border border-slate-700 shadow-xl backdrop-blur font-medium transition flex items-center gap-1.5"
                >
                  <span>🌐</span> All Pins
                </button>
              </div>

              {/* SLIDE-OUT DETAIL DRAWER / POPUP */}
              {selectedJob && (
                <div className="absolute top-4 left-4 right-4 sm:right-auto sm:w-96 max-h-[85%] bg-slate-900/95 border border-slate-700 rounded-2xl shadow-2xl backdrop-blur z-30 flex flex-col overflow-hidden animate-in fade-in slide-in-from-left duration-200">
                  
                  {/* Drawer Header */}
                  <div className="p-4 border-b border-slate-800 flex items-start justify-between bg-slate-800/50">
                    <div>
                      <span className="text-[10px] font-mono uppercase tracking-wider text-emerald-400 font-bold">Job Details</span>
                      <h2 className="text-base font-bold text-white mt-0.5">{selectedJob['Job Title']}</h2>
                      <p className="text-xs text-slate-300 font-medium">{selectedJob['Company']}</p>
                    </div>
                    <button
                      onClick={() => setSelectedJob(null)}
                      className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition"
                    >
                      ✕
                    </button>
                  </div>

                  {/* Drawer Content */}
                  <div className="p-4 overflow-y-auto space-y-3.5 text-xs text-slate-300 flex-1">
                    
                    {/* Quick Specs Grid */}
                    <div className="grid grid-cols-2 gap-2 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
                      <div>
                        <span className="text-slate-500 text-[10px] block">Location</span>
                        <span className="font-semibold text-white">{selectedJob.displayLocation}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 text-[10px] block">Compensation</span>
                        <span className="font-semibold text-emerald-400">{selectedJob['Compensation'] || 'Not listed'}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 text-[10px] block">Job ID</span>
                        <span className="font-mono text-slate-300">{selectedJob['Job ID']}</span>
                      </div>
                      <div>
                        <span className="text-slate-500 text-[10px] block">Owner(s)</span>
                        <span className="font-medium text-slate-300">{selectedJob['Owners'] || 'N/A'}</span>
                      </div>
                      {selectedJob['Client Contact'] && (
                        <div className="col-span-2">
                          <span className="text-slate-500 text-[10px] block">Client Contact</span>
                          <span className="text-slate-300">{selectedJob['Client Contact']}</span>
                        </div>
                      )}
                    </div>

                    {/* Job Description */}
                    <div>
                      <h4 className="font-semibold text-slate-200 mb-1.5 flex items-center justify-between">
                        <span>Role Overview</span>
                        <button
                          onClick={() => copyJobPitch(selectedJob)}
                          className="text-emerald-400 hover:text-emerald-300 text-[11px] font-normal"
                        >
                          {copiedId === selectedJob.id ? '✓ Pitch Copied!' : 'Copy Summary'}
                        </button>
                      </h4>
                      <div className="bg-slate-950/40 p-3 rounded-xl border border-slate-800/80 text-slate-300 whitespace-pre-wrap leading-relaxed max-h-60 overflow-y-auto text-[11px]">
                        {selectedJob['Job Description'] || 'No full description provided.'}
                      </div>
                    </div>

                  </div>

                  {/* Drawer Footer Actions */}
                  <div className="p-3 border-t border-slate-800 bg-slate-900 flex items-center justify-between gap-2">
                    <button
                      onClick={() => copyJobPitch(selectedJob)}
                      className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg text-xs transition shadow flex items-center justify-center gap-1.5"
                    >
                      <span>📋</span>
                      <span>{copiedId === selectedJob.id ? 'Copied to Clipboard!' : 'Copy Pitch for Candidate'}</span>
                    </button>
                  </div>

                </div>
              )}

            </div>

          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
