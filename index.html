    // --- HAVERSINE DISTANCE FORMULA ---
    function calculateDistance(lat1, lon1, lat2, lon2, unit = 'km') {
      const R = unit === 'mi' ? 3958.8 : 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) *
        Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c * 10) / 10;
    }

    // --- ROBUST CSV PARSER ---
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(cell);
          cell = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(cell);
          if (row.length > 0 && row.some(c => c.trim() !== '')) {
            lines.push(row);
          }
          row = [];
          cell = '';
        } else {
          cell += char;
        }
      }
      if (cell !== '' || row.length > 0) {
        row.push(cell);
        lines.push(row);
      }

      if (lines.length < 2) return [];
      const headers = lines[0].map(h => h.trim().replace(/^"|"$/g, ''));
      return lines.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = (r[idx] || '').trim();
        });
        return obj;
      });
    }

    // Normalizes location text and resolves coordinates
    function resolveCoordinates(locationStr, jobDescription = '') {
      if (!locationStr || locationStr.trim() === '') {
        const match = jobDescription.match(/Location:\s*([^\r\n,]+(?:,\s*[^\r\n]+)?)/i);
        if (match && match[1]) {
          locationStr = match[1].trim();
        }
      }

      if (!locationStr) return null;

      const cleaned = locationStr.toLowerCase().replace(/[^\w\s,]/g, '').trim();
      
      if (CITY_COORDINATES[cleaned]) {
        return { latLng: CITY_COORDINATES[cleaned], resolvedName: locationStr };
      }

      for (const [key, coords] of Object.entries(CITY_COORDINATES)) {
        if (cleaned.includes(key) || key.includes(cleaned)) {
          return { latLng: coords, resolvedName: locationStr };
        }
      }

      return null;
    }

    // --- JSONP GOOGLE SHEETS FETCHER ---
    function fetchSheetViaJSONP(sheetId, sheetName) {
      return new Promise((resolve, reject) => {
        const callbackName = 'sheetCallback_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        
        window[callbackName] = function(data) {
          try {
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
            if (!data || !data.table) {
              reject(new Error('Invalid table format from Google Sheets'));
              return;
            }
            const headers = data.table.cols.map(c => (c.label || c.id || '').trim());
            const rows = data.table.rows.map(r => {
              const obj = {};
              headers.forEach((h, idx) => {
                const cell = r.c && r.c[idx];
                obj[h] = cell && cell.v !== null && cell.v !== undefined ? String(cell.v) : (cell && cell.f ? String(cell.f) : '');
              });
              return obj;
            });
            resolve(rows);
          } catch (e) {
            reject(e);
          }
        };

        script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${callbackName}`;
        script.onerror = () => {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          reject(new Error('JSONP network error'));
        };
        document.body.appendChild(script);
      });
    }

          const cleanQuery = searchQuery.toLowerCase().trim();
          let coords = null;
          let displayName = searchQuery;

          for (const [key, val] of Object.entries(CITY_COORDINATES)) {
            if (cleanQuery === key || cleanQuery.includes(key) || key.includes(cleanQuery)) {
              coords = val;
              displayName = key.toUpperCase();
              break;
            }
          }

          // Fallback to OpenStreetMap Nominatim strictly within CA and US
          if (!coords) {
            const nominatimUrl = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ca,us&q=${encodeURIComponent(searchQuery)}`;
            const res = await fetch(nominatimUrl, { headers: { 'Accept-Language': 'en' } });
            const data = await res.json();
            if (data && data.length > 0) {
              coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
              displayName = data[0].display_name.split(',').slice(0, 2).join(',');
            }
          }

          if (coords) {
            setSearchCoords(coords);
            setSearchAddressName(displayName);

            if (map) {
              if (searchMarkerRef.current) map.removeLayer(searchMarkerRef.current);
              if (radiusCircleRef.current) map.removeLayer(radiusCircleRef.current);

              const searchIcon = L.divIcon({
                html: `
                  <div class="relative flex items-center justify-center">
                    <div class="w-8 h-8 rounded-full bg-stone-900 border-2 border-white shadow-xl flex items-center justify-center text-white text-xs font-bold candidate-pulse">
                      📍
                    </div>
                  </div>
                `,
                className: 'search-user-marker',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
              });

              searchMarkerRef.current = L.marker(coords, { icon: searchIcon, zIndexOffset: 1000 })
                .bindTooltip(`<b>Candidate Location</b><br/>${displayName}`, { permanent: true, direction: 'bottom', offset: [0, 10], className: 'custom-tooltip' })
                .addTo(map);

              if (maxRadius !== 'ALL') {
                const radiusMeters = parseInt(maxRadius) * (unit === 'mi' ? 1609.34 : 1000);
                radiusCircleRef.current = L.circle(coords, {
                  radius: radiusMeters,
                  color: '#2B2723',
                  fillColor: '#787165',
                  fillOpacity: 0.1,
                  weight: 1.5,
                  dashArray: '4, 6'
                }).addTo(map);
              }

              map.flyTo(coords, 9, { duration: 1 });
            }
          } else {
            alert(`Location "${searchQuery}" not found. Try including city & province/state (e.g., "London, ON").`);
          }
        } catch (err) {
          console.error('Geocoding error:', err);
          alert('Error resolving location.');
        } finally {
          setIsSearchingLocation(false);
        }
      };

      // 5. Unique Owners
      const uniqueOwners = useMemo(() => {
        const ownersSet = new Set();
        jobs.forEach(j => {
          if (j['Owners']) {
            j['Owners'].split(',').forEach(o => ownersSet.add(o.trim()));
          }
        });
        return Array.from(ownersSet).sort();
      }, [jobs]);

      // 6. Filter & Sort Jobs
      const processedJobs = useMemo(() => {
        return jobs
          .map(job => {
            let distance = null;
            if (searchCoords && job.coords) {
              distance = calculateDistance(
                searchCoords[0],
                searchCoords[1],
                job.coords[0],
                job.coords[1],
                unit
              );
            }
            return { ...job, distance };
          })
          .filter(job => {
            if (keywordFilter.trim()) {
              const kw = keywordFilter.toLowerCase();
              const matchTitle = (job['Job Title'] || '').toLowerCase().includes(kw);
              const matchCompany = (job['Company'] || '').toLowerCase().includes(kw);
              const matchLoc = (job['displayLocation'] || '').toLowerCase().includes(kw);
              const matchDesc = (job['Job Description'] || '').toLowerCase().includes(kw);
              if (!matchTitle && !matchCompany && !matchLoc && !matchDesc) return false;
            }

            if (selectedOwner !== 'ALL') {
              const owners = (job['Owners'] || '').split(',').map(o => o.trim());
              if (!owners.includes(selectedOwner)) return false;
            }

            if (searchCoords && maxRadius !== 'ALL' && job.distance !== null) {
              if (job.distance > parseInt(maxRadius)) return false;
            }

            return true;
          })
          .sort((a, b) => {
            if (searchCoords) {
              if (a.distance === null) return 1;
              if (b.distance === null) return -1;
              return a.distance - b.distance;
            }
            return 0;
          });
      }, [jobs, searchCoords, keywordFilter, selectedOwner, maxRadius, unit]);

      const handleSelectJob = (job) => {

            {/* INTERACTIVE MAP */}

                    <div>
                      <h4 className="font-semibold text-stone-900 mb-1.5 flex items-center justify-between">
                        <span>Role Details</span>
                        <button
                          onClick={() => copyJobPitch(selectedJob)}
                          className="text-stone-500 hover:text-stone-900 text-[11px] font-normal underline"
                        >
                          {copiedId === selectedJob.id ? '✓ Pitch Copied' : 'Copy Pitch'}
                        </button>
                      </h4>
                      <div className="bg-stone-50 p-3 rounded-2xl border border-stone-200/60 text-stone-700 whitespace-pre-wrap leading-relaxed max-h-60 overflow-y-auto text-[11px]">
                        {selectedJob['Job Description'] || 'No description provided.'}
                      </div>
                    </div>

                  </div>

                  {/* Drawer Footer Actions */}
                  <div className="p-3 border-t border-stone-100 bg-stone-50 flex items-center justify-between gap-2">
                    <button
                      onClick={() => copyJobPitch(selectedJob)}
                      className="flex-1 bg-stone-900 hover:bg-stone-800 text-white font-medium py-2.5 rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-1.5"
                    >
                      <span>📋</span>
                      <span>{copiedId === selectedJob.id ? 'Copied to Clipboard!' : 'Copy Pitch for Candidate'}</span>
                    </button>
                  </div>

                </div>
              )}

            </div>

          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
