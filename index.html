                  {/* Scrollable Candidates List */}
                  <div className="p-4 overflow-y-auto space-y-3 text-xs text-stone-700 flex-1 custom-scrollbar">
                    {filteredCityCandidates.length === 0 ? (
                      <div className="py-12 text-center text-stone-400 space-y-2">
                                                <p className="text-sm font-semibold text-stone-800">No candidates match search</p>
                        <p className="text-xs text-stone-500">Try clearing the search filter above.</p>
                      </div>
                    ) : (
                      filteredCityCandidates.map((cand) => {
                        const isSelectedFromMap = selectedCandidateGroup && selectedCandidateGroup.selectedCandidateId === cand.id;
                        return (
                          <div
                            key={cand.id}
                            className={`p-3.5 rounded-xl border transition-colors space-y-2 ${
                              isSelectedFromMap
                                ? 'border-stone-900 bg-white ring-1 ring-stone-900'
                                : 'border-stone-200 bg-white hover:border-stone-400'
                            }`}
                          >
                          {/* Name & Title */}
                          <div className="flex items-start justify-between gap-2">
                            <div className="flex-1 pr-1">
                              <h5 className="font-bold text-xs text-stone-900">{cand.name}</h5>
                              <p className="text-[11px] font-semibold text-stone-700 mt-0.5">{cand.title}</p>
                            </div>
                            {cand.compensationTarget && (
                              <span className="text-[11px] text-stone-900 font-semibold shrink-0 text-right max-w-[45%]">
                                {cand.compensationTarget}
                              </span>
                            )}
                          </div>

                          {/* Zero-Clutter Details: Strictly omit empty fields */}
                          <div className="space-y-1 text-[11px]">
                            {cand.company && (
                              <p className="text-stone-600">
                                Company: <span className="font-medium text-stone-800">{cand.company}</span>
                              </p>
                            )}

                            {cand.industry && (
                              <p className="text-stone-600">
                                Industry: <span className="font-normal">{cand.industry}</span>
                              </p>
                            )}

                            {cand.notes && (
                              <div className="p-2 rounded-xl text-[10px] bg-stone-50 border border-stone-200/60 text-stone-600 leading-relaxed">
                                <b>Notes / Target:</b> {cand.notes}
                              </div>
                            )}

                            {cand.shift && (
                              <p className="text-stone-500 text-[10px]">Shift: {cand.shift}</p>
                            )}

                          </div>

                          <CandidateSubmissionLink candidate={cand} />
                          {/* Action Buttons */}
                          <div className="pt-2 border-t border-stone-100 flex items-center justify-between text-xs">
                            <CopyButton onCopy={() => copyCandidatePitch(cand)} copied={copiedId === cand.id} label="Copy candidate summary" />


                          </div>

                        </div>
                      );
                    })
                  )}
                  </div>

                  {/* Drawer Footer Actions */}
                  <div className="p-3 border-t border-stone-100 bg-stone-50 flex items-center justify-between gap-2 shrink-0">
                    <span className="text-[11px] text-stone-500">
                      Showing {filteredCityCandidates.length} candidate{filteredCityCandidates.length !== 1 ? 's' : ''} in {selectedCandidateGroup.cityName}
                    </span>
                    <button
                      onClick={() => setSelectedCandidateGroup(null)}
                      className="text-stone-600 hover:text-stone-900 text-xs font-semibold px-2.5 py-1 rounded-lg border border-stone-200 hover:bg-stone-100 transition"
                    >
                      Close
                    </button>
                  </div>

                </div>
              )}

            </div>

            {/* RIGHT PANEL: CANDIDATES MATCHED TO THE PICKED JOB */}
            {selectedJob && (
              <aside
                style={{ width: isDesktop ? '380px' : '100%' }}
                className={`border-l border-stone-200 bg-[#FAF9F6] flex-col shrink-0 overflow-hidden ${activeTab === 'matches' ? 'flex' : 'hidden lg:flex'}`}
              >
                <div className="px-3.5 h-11 bg-white border-b border-stone-200 flex items-center justify-between text-xs shrink-0">
                  <span className="font-semibold text-stone-900">Candidate matches</span>
                  <span className="text-stone-700"><b className="text-stone-900">{matchedCandidates.length}</b> found</span>
                </div>

                <div className="p-3.5 bg-white border-b border-stone-200 space-y-3 shrink-0">
                  {/* Radius dial */}
                  <div>
                    <div className="flex items-center justify-between text-[11px] mb-1.5">
                      <label htmlFor="radius-dial" className="font-semibold text-stone-900">Radius</label>
                      <span className="text-stone-900">{radiusKm === 'ALL' ? 'All locations' : `${radiusKm} km`}</span>
                    </div>
                    <div className="flex items-center gap-2.5">
                      <input
                        id="radius-dial"
                        type="range" min="10" max="150" step="5"
                        value={radiusKm === 'ALL' ? 150 : radiusKm}
                        onChange={(e) => setRadiusKm(Number(e.target.value))}
                        className={`radius-dial flex-1 ${radiusKm === 'ALL' ? 'opacity-40' : ''}`}
                      />
                      <button
                        onClick={() => setRadiusKm(prev => prev === 'ALL' ? 50 : 'ALL')}
                        aria-pressed={radiusKm === 'ALL'}
                        className={`h-7 px-2.5 rounded-md border text-[11px] font-semibold transition-colors ${
                          radiusKm === 'ALL' ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-900 border-stone-300 hover:bg-stone-100'
                        }`}
                      >
                        All
                      </button>
                    </div>
                    <p className="text-[10.5px] text-stone-600 mt-1.5">Title matches outside the radius, or with no location, stay listed. All shows everyone. Distances are city level estimates.</p>
                  </div>

                  <div className="flex items-center gap-2">
                    <select aria-label="Candidate match type" value={candidateMatchScope}
                      onChange={(e) => setCandidateMatchScope(e.target.value)}
                      className="control-field flex-1 min-w-0 cursor-pointer">
                      <option value="relevant">Title + related matches</option>
                      <option value="role">Title matches only</option>
                      <option value="similar">Similar roles or background</option>
                      <option value="industry">Related industry only</option>
                    </select>
                  </div>
                  <div className="relative">
                    <input
                      type="text"
                      placeholder="Filter by name, skill, or notes"
                      value={candidateSearchText}
                      onChange={(e) => setCandidateSearchText(e.target.value)}
                      className="control-field w-full pr-8"
                    />
                    {candidateSearchText && (
                      <button onClick={() => setCandidateSearchText('')} aria-label="Clear candidate filter"
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-stone-500 hover:text-stone-900">✕</button>
                    )}
                  </div>
                  {trackerLinkWarning && <p className="text-[11px] text-stone-900">{trackerLinkWarning}</p>}
                </div>

                <div key={`matches-${selectedJob.id}`} className="flex-1 overflow-y-auto p-3.5 space-y-3 overscroll-contain custom-scrollbar">
                  {matchedCandidates.length === 0 ? (
                    <div className="py-12 text-center space-y-2">
                      <p className="text-sm font-semibold text-stone-900">No candidates match these criteria</p>
                      <p className="text-xs text-stone-600">Try widening the radius, clearing the filter, or choosing "Title + related matches".</p>
                    </div>
                  ) : (
                    matchedCandidates.map(cand => renderCandidateCard(cand))
                  )}
                </div>
              </aside>
            )}

          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
